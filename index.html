<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>死神值班：电车裁决</title>
  <style>
    :root {
      --bg: #111318;
      --panel: #1b1f2a;
      --text: #f2f4f8;
      --muted: #aab1c3;
      --left: #2b8a3e;
      --right: #c92a2a;
      --accent: #ffd43b;
      --border: #2a3040;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 20%, #1c2130 0, var(--bg) 45%);
      color: var(--text);
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .app {
      width: min(860px, 100%);
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr;
    }

    .menu {
      min-height: 520px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: linear-gradient(170deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 18px;
      padding: 36px;
      text-align: center;
    }

    .menu h1 {
      margin: 0;
      font-size: clamp(30px, 6vw, 56px);
      line-height: 1.1;
    }

    .menu p {
      margin: 0;
      max-width: 560px;
      color: var(--muted);
      line-height: 1.7;
      white-space: pre-line;
    }

    .start-button {
      min-width: 180px;
      padding: 14px 20px;
      border-color: rgba(255, 212, 59, 0.45);
      background: #1e2430;
      font-size: 18px;
    }

    .game-shell {
      display: grid;
      gap: 16px;
    }

    .menu[hidden],
    .game-shell[hidden] {
      display: none;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .audio-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 20;
      width: 92px;
      padding: 10px 12px;
      border-radius: 999px;
      font-size: 13px;
      color: var(--text);
      background: rgba(22, 27, 37, 0.92);
      backdrop-filter: blur(10px);
    }

    .audio-toggle[aria-pressed="false"] {
      color: var(--muted);
    }

    .board {
      position: relative;
      min-height: 420px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: linear-gradient(170deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
      overflow: hidden;
      padding: 24px;
    }

    .card {
      position: absolute;
      inset: 24px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--panel);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      cursor: grab;
      user-select: none;
      transition: transform 180ms ease, opacity 180ms ease;
      touch-action: none;
    }

    .card h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.35;
    }

    .card p {
      margin: 0;
      color: #d9deea;
      line-height: 1.6;
      font-size: 16px;
      white-space: pre-line;
    }

    .card-tag {
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .choice-hint {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .left-flag, .right-flag {
      position: absolute;
      top: 18px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 120ms ease;
      font-weight: 600;
    }

    .left-flag {
      left: 18px;
      background: rgba(43, 138, 62, 0.2);
      color: #8ce99a;
      border: 1px solid rgba(43, 138, 62, 0.35);
    }

    .right-flag {
      right: 18px;
      background: rgba(201, 42, 42, 0.18);
      color: #ffa8a8;
      border: 1px solid rgba(201, 42, 42, 0.35);
    }

    .show-left .left-flag,
    .show-right .right-flag { opacity: 1; }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      border: 1px solid var(--border);
      background: #161b25;
      color: var(--text);
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.06); }

    .axis {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      background: rgba(0,0,0,0.15);
      display: grid;
      gap: 10px;
    }

    .axis-row {
      display: grid;
      grid-template-columns: 122px 1fr 122px;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .bar {
      position: relative;
      height: 8px;
      border-radius: 999px;
      background: #111621;
      overflow: hidden;
    }

    .bar-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 0;
      transform: translateX(-50%);
      background: linear-gradient(90deg, #74c0fc, #ff8787);
      transition: width 200ms ease;
    }

    .result {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
      padding: 18px;
      display: none;
      gap: 10px;
    }

    .result.show { display: grid; }

    .result h3 {
      margin: 0;
      font-size: 26px;
    }

    .share {
      border: 1px solid var(--border);
      background: #111621;
      border-radius: 10px;
      padding: 10px;
      color: #d9deea;
      white-space: pre-line;
      font-size: 14px;
    }

    .muted { color: var(--muted); }

    @media (max-width: 700px) {
      .card { inset: 12px; }
      .axis-row { grid-template-columns: 92px 1fr 92px; font-size: 12px; }
      .card h2 { font-size: 20px; }
    }
  </style>
</head>
<body>
  <button class="audio-toggle" id="musicToggle" aria-pressed="true">音乐 ON</button>
  <main class="app">
    <section class="menu" id="mainMenu">
      <div class="muted">Death Shift Personality Test</div>
      <h1>死神值班</h1>
      <p>在人类生死之间刷卡。
每一次选择，都会被记录。</p>
      <button class="start-button" id="startBtn">开始游戏</button>
    </section>

    <section class="game-shell" id="gameShell" hidden>
      <div class="topbar">
        <div id="progress">第 1 / 15 卡</div>
        <div>操作：← / A 选左，→ / D 选右，或拖拽卡片</div>
      </div>

      <section class="board" id="board">
        <article class="card" id="card">
          <div class="left-flag" id="leftFlag"></div>
          <div class="right-flag" id="rightFlag"></div>
          <div class="card-tag" id="tag"></div>
          <h2 id="title"></h2>
          <p id="body"></p>
          <div class="choice-hint">
            <span id="leftChoice"></span>
            <span id="rightChoice"></span>
          </div>
        </article>
      </section>

      <div class="controls" id="gameControls">
        <button id="btnLeft"></button>
        <button id="btnRight"></button>
      </div>

      <section class="axis" id="axisBoard"></section>
    </section>

    <section class="result" id="result">
      <div class="muted">人格结算</div>
      <h3 id="typeName"></h3>
      <div id="typeCode"></div>
      <p id="typeDesc"></p>
      <div class="share" id="shareText"></div>
      <div class="controls">
        <button id="copyBtn">复制分享文案</button>
        <button id="restartBtn">再值一次班</button>
      </div>
    </section>
  </main>

  <script>
    const CONFIG_URLS = {
      story: "submissions/shinigami/config/shinigami_story_config.json",
      types: "submissions/shinigami/config/shinigami_16types_config.json"
    };

    const SFX = {
      cardMotion: [
        {
          url: "submissions/austin/audio-placeholder-v01/assets/audio/sfx/u_nharq4usid-swipe-255512.mp3",
          gain: 1.0
        },
        {
          url: "submissions/austin/audio-placeholder-v01/assets/audio/sfx/universfield-swoosh-026-454861.mp3",
          gain: 0.28
        }
      ],
      volume: 0.42,
      pitchJitter: 0.2
    };

    const BGM = {
      tracks: {
        menu: {
          url: "submissions/austin/audio-placeholder-v01/assets/audio/music/00.mp3",
          anchors: {
            start1: { at: 0, type: "intro" },
            loop1: { at: 0, type: "intro" }
          }
        },
        first: {
          url: "submissions/austin/audio-placeholder-v01/assets/audio/music/01.mp3",
          anchors: {
            intro1: { at: 0, type: "intro" },
            chorus1: { at: 45, type: "chorus" },
            bridge1: { at: 75, type: "bridge" }
          }
        },
        oneThird: {
          url: "submissions/austin/audio-placeholder-v01/assets/audio/music/02.mp3",
          anchors: {
            intro1: { at: 0, type: "intro" },
            intro2: { at: 22, type: "intro" },
            chorus1: { at: 45, type: "chorus" },
            bridge1: { at: 67, type: "bridge" },
            intro3: { at: 73, type: "intro" },
            intro4: { at: 91, type: "intro" },
            chorus2: { at: 101, type: "chorus" },
            chorus3: { at: 113, type: "chorus" },
            bridge2: { at: 124, type: "bridge" },
            bridge3: { at: 135, type: "bridge" },
            intro5: { at: 147, type: "intro" },
            intro6: { at: 158, type: "intro" },
            intro7: { at: 170, type: "intro" },
            chorus4: { at: 180, type: "chorus" },
            chorus5: { at: 192, type: "chorus" },
            outro1: { at: 204, type: "outro" }
          }
        },
        twoThirds: {
          url: "submissions/austin/audio-placeholder-v01/assets/audio/music/03.mp3",
          anchors: {
            intro1: { at: 0, type: "intro" },
            chorus1: { at: 45, type: "chorus" },
            bridge1: { at: 75, type: "bridge" }
          }
        }
      },
      transitions: {
        "menu->first": {
          intro: [{ target: "intro1" }]
        },
        "first->oneThird": {
          intro: [{ target: "intro1" }],
          chorus: [{ target: "intro1" }],
          bridge: [{ target: "intro1" }],
          outro: [{ target: "intro1" }],
          default: [{ target: "intro1" }]
        },
        "oneThird->twoThirds": {
          intro: [{ target: "intro1" }],
          chorus: [{ target: "intro1" }],
          bridge: [{ target: "intro1" }],
          outro: [{ target: "intro1" }],
          default: [{ target: "intro1" }]
        }
      },
      volume: 0.17,
      fadeMs: 1800,
      anchorWaitMaxMs: 4000
    };

    const axes = {
      QI: { left: "Q 数量主义", right: "I 个体主义", score: 0 },
      SP: { left: "S 自我圈层", right: "P 公共中立", score: 0 },
      FN: { left: "F 长期结果", right: "N 当下止损", score: 0 },
      RB: { left: "R 规则服从", right: "B 规则突破", score: 0 }
    };

    const els = {
      mainMenu: document.getElementById("mainMenu"),
      gameShell: document.getElementById("gameShell"),
      startBtn: document.getElementById("startBtn"),
      musicToggle: document.getElementById("musicToggle"),
      card: document.getElementById("card"),
      tag: document.getElementById("tag"),
      title: document.getElementById("title"),
      body: document.getElementById("body"),
      leftChoice: document.getElementById("leftChoice"),
      rightChoice: document.getElementById("rightChoice"),
      btnLeft: document.getElementById("btnLeft"),
      btnRight: document.getElementById("btnRight"),
      progress: document.getElementById("progress"),
      leftFlag: document.getElementById("leftFlag"),
      rightFlag: document.getElementById("rightFlag"),
      axisBoard: document.getElementById("axisBoard"),
      result: document.getElementById("result"),
      typeName: document.getElementById("typeName"),
      typeCode: document.getElementById("typeCode"),
      typeDesc: document.getElementById("typeDesc"),
      shareText: document.getElementById("shareText"),
      copyBtn: document.getElementById("copyBtn"),
      restartBtn: document.getElementById("restartBtn"),
      gameControls: document.getElementById("gameControls")
    };

    let cards = [];
    let cardIndexById = {};
    let typeConfigs = {};
    let idx = 0;
    let dragging = false;
    let startX = 0;
    let offsetX = 0;
    let sfxUnlocked = false;
    let gameStarted = false;
    let currentBgm = null;
    let currentBgmKey = "";
    let pendingBgmKey = "";
    let musicEnabled = true;
    const sfxPool = SFX.cardMotion.map((sfx) => {
      const audio = new Audio(sfx.url);
      audio.preload = "auto";
      audio.volume = clamp(SFX.volume * (sfx.gain || 1), 0, 1);
      return { audio, gain: sfx.gain || 1 };
    });
    const SWIPE_THRESHOLD = 110;
    const branchMergeRules = {
      "10-L": { group: "10", counterpart: "10-R", target: "12" },
      "10-R": { group: "10", counterpart: "10-L", target: "12" },
      "18-L": { group: "18", counterpart: "18-R", target: "20" },
      "18-R": { group: "18", counterpart: "18-L", target: "20" },
      "26-L": { group: "26", counterpart: "26-R", target: "28" },
      "26-R": { group: "26", counterpart: "26-L", target: "28" }
    };
    let branchVisitState = {};

    function clamp(v, min, max) {
      return Math.min(max, Math.max(min, v));
    }

    function playCardMotionSfx() {
      if (!sfxPool.length) return;
      const { audio } = sfxPool[Math.floor(Math.random() * sfxPool.length)];
      audio.pause();
      audio.currentTime = 0;
      audio.playbackRate = 1 + (Math.random() * 2 - 1) * SFX.pitchJitter;
      audio.play().catch(() => {});
    }

    function unlockSfx() {
      if (sfxUnlocked || !sfxPool.length) return;
      sfxUnlocked = true;
      sfxPool.forEach(({ audio }) => audio.load());
    }

    function fadeAudio(audio, from, to, durationMs, onDone) {
      const startedAt = performance.now();
      audio.volume = from;
      const timer = setInterval(() => {
        const t = clamp((performance.now() - startedAt) / durationMs, 0, 1);
        audio.volume = from + (to - from) * t;
        if (t >= 1) {
          clearInterval(timer);
          if (onDone) onDone();
        }
      }, 40);
    }

    function sortedAnchors(track) {
      return Object.entries(track?.anchors || {})
        .map(([name, anchor]) => ({ name, ...anchor }))
        .sort((a, b) => a.at - b.at);
    }

    function currentAnchorForTrack(key) {
      const track = BGM.tracks[key];
      if (!track || !currentBgm) return null;
      return sortedAnchors(track).reduce((current, anchor) => {
        return anchor.at <= currentBgm.currentTime ? anchor : current;
      }, null);
    }

    function nextAnchorForTrack(key) {
      const track = BGM.tracks[key];
      if (!track || !currentBgm) return null;
      return sortedAnchors(track).find((anchor) => anchor.at > currentBgm.currentTime) || null;
    }

    function chooseTransition(fromKey, toKey) {
      const fromAnchor = currentAnchorForTrack(fromKey);
      const fromType = fromAnchor?.type || "default";
      const rule = BGM.transitions[`${fromKey}->${toKey}`] || {};
      const options = rule[fromType] || rule.default || [{ target: "intro1" }];
      const weighted = options.flatMap((option) => Array(option.weight || 1).fill(option));
      return weighted[Math.floor(Math.random() * weighted.length)] || options[0];
    }

    function bgmEntryTime(key, anchorName) {
      const targetTrack = BGM.tracks[key];
      if (!targetTrack) return 0;
      return targetTrack.anchors?.[anchorName]?.at || 0;
    }

    function msUntilNextMusicalAnchor(key) {
      const nextAnchor = nextAnchorForTrack(key);
      if (!nextAnchor) return 0;
      return Math.min((nextAnchor.at - currentBgm.currentTime) * 1000, BGM.anchorWaitMaxMs);
    }

    function switchBgm(key, fadeMs = BGM.fadeMs, waitForAnchor = true) {
      const track = BGM.tracks[key];
      if (!track) return;
      if (!musicEnabled) {
        currentBgmKey = key;
        if (currentBgm) {
          currentBgm.pause();
          currentBgm.currentTime = 0;
          currentBgm = null;
        }
        return;
      }
      if (currentBgmKey === key) {
        if (currentBgm && currentBgm.paused) {
          currentBgm.play().then(() => {
            fadeAudio(currentBgm, currentBgm.volume, BGM.volume, fadeMs);
          }).catch(() => {});
        }
        return;
      }

      const previousKey = currentBgmKey;
      const waitMs = 0;
      if (waitMs > 0) {
        pendingBgmKey = key;
        setTimeout(() => {
          if (pendingBgmKey === key) switchBgm(key, fadeMs, false);
        }, waitMs);
        return;
      }
      pendingBgmKey = "";
      currentBgmKey = key;
      const transition = chooseTransition(previousKey, key);

      const nextBgm = new Audio(track.url);
      nextBgm.loop = true;
      nextBgm.preload = "auto";
      nextBgm.volume = 0;
      nextBgm.currentTime = bgmEntryTime(key, transition.target);

      const previousBgm = currentBgm;
      currentBgm = nextBgm;

      const startNextBgm = () => nextBgm.play().then(() => {
        fadeAudio(nextBgm, 0, BGM.volume, fadeMs);
      }).catch(() => {});

      if (transition.silenceMs) {
        setTimeout(startNextBgm, transition.silenceMs);
      } else {
        startNextBgm();
      }

      if (previousBgm) {
        const previousVolume = previousBgm.volume;
        fadeAudio(previousBgm, previousVolume, 0, fadeMs, () => {
          previousBgm.pause();
          previousBgm.currentTime = 0;
        });
      }
    }

    function chapterBgmForIndex(cardIndex) {
      if (!cards.length) return "first";
      const oneThird = 8;
      const twoThirds = 23;

      if (cardIndex >= twoThirds) return "twoThirds";
      if (cardIndex >= oneThird) return "oneThird";
      return "first";
    }

    function updateChapterBgm() {
      switchBgm(chapterBgmForIndex(idx));
    }

    function setMusicEnabled(enabled) {
      musicEnabled = enabled;
      els.musicToggle.setAttribute("aria-pressed", String(enabled));
      els.musicToggle.textContent = enabled ? "音乐 ON" : "音乐 OFF";

      if (!enabled) {
        if (currentBgm) {
          fadeAudio(currentBgm, currentBgm.volume, 0, 250, () => {
            currentBgm.pause();
          });
        }
        return;
      }

      if (gameStarted) {
        currentBgmKey = "";
        switchBgm(chapterBgmForIndex(idx), 500, false);
      } else {
        currentBgmKey = "";
        switchBgm("menu", 500, false);
      }
    }

    function toggleMusic() {
      setMusicEnabled(!musicEnabled);
    }

    function resetBranchVisitState() {
      branchVisitState = Object.values(branchMergeRules).reduce((acc, rule) => {
        acc[rule.group] = { visited: new Set(), displayOrder: [] };
        return acc;
      }, {});
    }

    function hasCardId(cardId) {
      return Object.prototype.hasOwnProperty.call(cardIndexById, String(cardId));
    }

    function resolveBranchMergeNext(card) {
      const rule = branchMergeRules[String(card.id)];
      if (!rule) {
        return null;
      }

      const state = branchVisitState[rule.group] || { visited: new Set() };
      state.visited.add(String(card.id));
      branchVisitState[rule.group] = state;

      if (!state.visited.has(rule.counterpart) && hasCardId(rule.counterpart)) {
        return rule.counterpart;
      }

      const mergeTarget = hasCardId(rule.target) ? rule.target : rule.fallbackTarget;
      if (mergeTarget && hasCardId(mergeTarget)) {
        state.visited.clear();
        state.displayOrder = [];
        return mergeTarget;
      }

      return null;
    }

    function getDisplaySequence(card) {
      const fallbackSequence = card.sequence ?? idx + 1;
      const rule = branchMergeRules[String(card.id)];
      if (!rule) {
        return fallbackSequence;
      }

      const state = branchVisitState[rule.group] || { visited: new Set(), displayOrder: [] };
      if (!state.displayOrder.includes(String(card.id))) {
        state.displayOrder.push(String(card.id));
      }
      branchVisitState[rule.group] = state;

      const branchPosition = state.displayOrder.indexOf(String(card.id));
      return Number(rule.group) + Math.max(branchPosition, 0);
    }

    async function loadJson(url) {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`${url} 加载失败：${response.status}`);
      }
      return response.json();
    }

    async function loadConfigs() {
      els.progress.textContent = "正在读取配置...";
      const [storyConfig, typeConfig] = await Promise.all([
        loadJson(CONFIG_URLS.story),
        loadJson(CONFIG_URLS.types)
      ]);

      cards = Array.isArray(storyConfig.cards) ? storyConfig.cards : [];
      typeConfigs = typeConfig.types || {};
      cardIndexById = Object.fromEntries(cards.map((card, index) => [String(card.id), index]));

      if (!cards.length) {
        throw new Error("剧情配置里没有可用卡牌");
      }
      if (!Object.keys(typeConfigs).length) {
        throw new Error("人格配置里没有可用类型");
      }
    }

    function showConfigError(error) {
      els.tag.textContent = "配置读取失败";
      els.title.textContent = "无法加载玩法配置";
      const localPreviewHint = location.protocol === "file:" ? [
        "你正在直接打开本地 index.html，浏览器会拦截本地 JSON 读取。",
        "请双击 Start_Local_Preview.bat，或在仓库根目录运行：",
        "python -m http.server 4174 --bind 127.0.0.1",
        "然后打开：http://127.0.0.1:4174/index.html",
        ""
      ] : [];
      els.body.textContent = [
        ...localPreviewHint,
        "请确认以下配置文件可以访问：",
        CONFIG_URLS.story,
        CONFIG_URLS.types,
        "",
        error.message
      ].join("\n");
      els.leftChoice.textContent = "";
      els.rightChoice.textContent = "";
      els.btnLeft.textContent = "配置未加载";
      els.btnRight.textContent = "配置未加载";
      els.btnLeft.disabled = true;
      els.btnRight.disabled = true;
      els.progress.textContent = "配置错误";
    }

    function applyEffects(effects) {
      Object.entries(effects || {}).forEach(([k, delta]) => {
        if (axes[k]) axes[k].score += Number(delta) || 0;
      });
    }

    function renderAxes() {
      const rows = Object.entries(axes).map(([k, axis]) => {
        const score = clamp(axis.score, -60, 60);
        const width = Math.abs(score) / 60 * 100;
        return `
          <div class="axis-row">
            <span>${axis.left}</span>
            <div class="bar"><div class="bar-fill" style="width:${width}%"></div></div>
            <span style="text-align:right">${axis.right}</span>
            <span class="muted" style="grid-column: 1 / 4;">${k}：${score >= 0 ? "偏" + axis.left : "偏" + axis.right}（${Math.abs(score)}）</span>
          </div>
        `;
      }).join("");
      els.axisBoard.innerHTML = rows;
    }

    function renderCard() {
      if (idx >= cards.length) {
        finishGame();
        return;
      }
      const card = cards[idx];
      const left = card.left || {};
      const right = card.right || {};
      const displaySequence = getDisplaySequence(card);
      els.tag.textContent = card.tag || `裁决 ${displaySequence}`;
      els.title.textContent = card.title || card.text || "未命名裁决";
      els.body.textContent = card.body || card.text || "";
      els.leftChoice.textContent = "← " + (left.label || "左选项");
      els.rightChoice.textContent = (right.label || "右选项") + " →";
      els.btnLeft.textContent = "左：" + (left.label || "左选项");
      els.btnRight.textContent = "右：" + (right.label || "右选项");
      els.leftFlag.textContent = "左：" + (left.label || "左选项");
      els.rightFlag.textContent = "右：" + (right.label || "右选项");
      els.progress.textContent = `第 ${displaySequence} / ${cards.length} 卡`;
      els.card.style.opacity = "1";
      els.card.style.transform = "translateX(0px) rotate(0deg)";
      els.card.classList.remove("show-left", "show-right");
      updateChapterBgm();
    }

    function nextIndexFor(card, choice) {
      const branchNextId = resolveBranchMergeNext(card);
      if (branchNextId && hasCardId(branchNextId)) {
        return cardIndexById[String(branchNextId)];
      }

      const nextId = choice.next || card.autoNext;
      if (nextId && hasCardId(nextId)) {
        return cardIndexById[String(nextId)];
      }
      return idx + 1;
    }

    function choose(side) {
      if (idx >= cards.length) return;
      const card = cards[idx];
      const choice = side === "left" ? card.left || {} : card.right || {};
      unlockSfx();
      playCardMotionSfx();
      applyEffects(choice.effects);

      const dir = side === "left" ? -1 : 1;
      els.card.style.transform = `translateX(${dir * 420}px) rotate(${dir * 12}deg)`;
      els.card.style.opacity = "0";

      setTimeout(() => {
        idx = nextIndexFor(card, choice);
        renderAxes();
        renderCard();
      }, 150);
    }

    function getTypeCode() {
      const q = axes.QI.score >= 0 ? "Q" : "I";
      const s = axes.SP.score >= 0 ? "S" : "P";
      const f = axes.FN.score >= 0 ? "F" : "N";
      const r = axes.RB.score >= 0 ? "R" : "B";
      return q + s + f + r;
    }

    function getTypeConfig(code) {
      return typeConfigs[code] || {
        name: "未命名人格",
        nameEn: code,
        headline: "你的人格类型是：",
        slogan: "",
        desc: "当前分值组合没有找到对应的人格配置。",
        shareText: `我测出${code}。`
      };
    }

    function axisSummary() {
      const mapping = {
        QI: ["Q 数量主义", "I 个体主义"],
        SP: ["S 自我圈层", "P 公共中立"],
        FN: ["F 长期结果", "N 当下止损"],
        RB: ["R 规则服从", "B 规则突破"]
      };
      return Object.keys(mapping).map((k) => {
        const v = axes[k].score;
        const label = v >= 0 ? mapping[k][0] : mapping[k][1];
        return `${label} ${Math.abs(v)}`;
      }).join(" | ");
    }

    function finishGame() {
      els.card.style.display = "none";
      document.getElementById("board").style.display = "none";
      els.gameControls.style.display = "none";
      const code = getTypeCode();
      const type = getTypeConfig(code);
      els.result.classList.add("show");
      els.typeName.textContent = type.name || code;
      els.typeCode.textContent = `${type.headline || "你的人格类型是："}${type.nameEn || code}（${code}）`;
      els.typeDesc.textContent = [type.slogan, type.subline, type.desc].filter(Boolean).join("\n\n");

      const share = [
        "【死神值班：电车裁决】",
        `我的结果：${type.name || code}（${type.nameEn || code}）`,
        type.shareText || "",
        axisSummary(),
        "你会签下怎样的死亡裁决？"
      ].filter(Boolean).join("\n");
      els.shareText.textContent = share;
      els.progress.textContent = "值班结束";
    }

    function resetGame() {
      Object.keys(axes).forEach((k) => axes[k].score = 0);
      idx = 0;
      gameStarted = true;
      resetBranchVisitState();
      els.result.classList.remove("show");
      els.mainMenu.hidden = true;
      els.gameShell.hidden = false;
      els.card.style.display = "flex";
      document.getElementById("board").style.display = "block";
      els.gameControls.style.display = "grid";
      renderAxes();
      renderCard();
    }

    function startGame() {
      unlockSfx();
      resetGame();
    }

    function onDragStart(clientX) {
      dragging = true;
      startX = clientX;
      offsetX = 0;
      els.card.style.transition = "none";
    }

    function onDragMove(clientX) {
      if (!dragging) return;
      offsetX = clientX - startX;
      const rotate = clamp(offsetX / 18, -14, 14);
      els.card.style.transform = `translateX(${offsetX}px) rotate(${rotate}deg)`;

      els.card.classList.toggle("show-left", offsetX < -40);
      els.card.classList.toggle("show-right", offsetX > 40);
    }

    function onDragEnd() {
      if (!dragging) return;
      dragging = false;
      els.card.style.transition = "transform 160ms ease, opacity 160ms ease";
      if (offsetX <= -SWIPE_THRESHOLD) {
        choose("left");
        return;
      }
      if (offsetX >= SWIPE_THRESHOLD) {
        choose("right");
        return;
      }
      els.card.style.transform = "translateX(0) rotate(0deg)";
      els.card.classList.remove("show-left", "show-right");
    }

    els.btnLeft.addEventListener("click", () => choose("left"));
    els.btnRight.addEventListener("click", () => choose("right"));
    els.startBtn.addEventListener("click", startGame);
    els.musicToggle.addEventListener("click", toggleMusic);
    els.mainMenu.addEventListener("pointerdown", () => switchBgm("menu", BGM.fadeMs, false), { once: true });

    document.addEventListener("keydown", (e) => {
      if (!gameStarted || idx >= cards.length) return;
      if (["ArrowLeft", "a", "A"].includes(e.key)) choose("left");
      if (["ArrowRight", "d", "D"].includes(e.key)) choose("right");
    });

    els.copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(els.shareText.textContent);
        els.copyBtn.textContent = "已复制";
      } catch {
        els.copyBtn.textContent = "复制失败，请手动复制";
      }
      setTimeout(() => els.copyBtn.textContent = "复制分享文案", 1200);
    });

    els.restartBtn.addEventListener("click", resetGame);

    els.card.addEventListener("pointerdown", (e) => {
      els.card.setPointerCapture(e.pointerId);
      onDragStart(e.clientX);
    });
    els.card.addEventListener("pointermove", (e) => onDragMove(e.clientX));
    els.card.addEventListener("pointerup", onDragEnd);
    els.card.addEventListener("pointercancel", onDragEnd);

    async function init() {
      try {
        await loadConfigs();
        resetBranchVisitState();
        renderAxes();
        switchBgm("menu", BGM.fadeMs, false);
      } catch (error) {
        els.mainMenu.hidden = true;
        els.gameShell.hidden = false;
        showConfigError(error);
      }
    }

    init();
  </script>
</body>
</html>
