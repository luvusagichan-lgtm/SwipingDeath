<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>死神值班</title>
  <style>
    @font-face {
      font-family: "GameFont";
      src: url("./assets/fonts/_思源柔黑体.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      --stage-w: min(100vw, calc(100vh * 16 / 9));
      --stage-h: min(100vh, calc(100vw * 9 / 16));

      --panel-w: min(34%, 430px);
      --bar-h: 84px;

      --panel-top-bottom: #dfe4e5;
      --panel-mid: #f5f3ef;
      --ink: #232323;

      --bg-image: url("./assets/scene/scene_01.png");
      --icon-ink: #0d4e4d;
    }

    * {
      box-sizing: border-box;
      font-family: "GameFont", sans-serif !important;
      font-weight: 400 !important;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101114;
    }

    .menu, .game {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
    }

    .menu {
      z-index: 30;
      background:
        linear-gradient(rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.28)),
        var(--bg-image) center/cover no-repeat;
    }

    .menu[hidden], .game[hidden] { display: none; }

    .menu-card {
      width: min(520px, 90vw);
      padding: 24px;
      border-radius: 14px;
      text-align: center;
      background: rgba(10, 18, 20, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 24px;
      font-size: 20px;
      cursor: pointer;
      background: #f2e8d6;
      color: #1f1f1f;
    }

    /* 固定 16:9 画布 */
    .stage {
      position: relative;
      width: var(--stage-w);
      height: var(--stage-h);
      overflow: hidden;
      background:
        linear-gradient(rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.28)),
        var(--bg-image) center/cover no-repeat;
    }

    .choice-bars {
      position: absolute;
      inset: 0;
      z-index: 70;
      pointer-events: none;
    }

    .side-choice {
      position: absolute;
      top: 56%;
      height: 72px;
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.85);
      color: #222;
      border-radius: 999px;
      opacity: 0.5;
      transition: opacity .08s linear, transform .08s linear;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      font-size: clamp(17px, 1.25vw, 24px);
    }

    .side-left {
      right: calc(50% + var(--panel-w) / 2 - 8px);
      width: min(44vw, 760px);
      justify-content: flex-end;
      padding: 0 24px;
      transform: translateY(-50%);
    }

    .side-right {
      left: calc(50% + var(--panel-w) / 2 - 8px);
      width: min(44vw, 760px);
      justify-content: flex-start;
      padding: 0 24px;
      transform: translateY(-50%);
    }

    .panel {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      width: var(--panel-w);
      height: 100%;
      display: grid;
      grid-template-rows: var(--bar-h) 1fr var(--bar-h);
      z-index: 20;
      pointer-events: none;
    }

    .top-bar,
    .bottom-bar {
      background: var(--panel-top-bottom);
      display: grid;
      align-items: center;
      min-height: var(--bar-h);
      max-height: var(--bar-h);
      padding: 0 14px;
      color: #222;
    }

    .top-bar { border-bottom: 1px solid #c6ccd2; }
    .bottom-bar {
      border-top: 1px solid #c6ccd2;
      place-items: center;
      text-align: center;
      font-size: clamp(16px, 1.1vw, 22px);
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .top-icons {
      height: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      justify-items: center;
      gap: 0;
    }

    .meter-icon {
      position: relative;
      width: 54px;
      height: 54px;
      --fill: 50%;
      --empty: calc(100% - var(--fill));
    }

    .meter-icon::before,
    .meter-icon::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      pointer-events: none;
      -webkit-mask-image: var(--icon-mask);
      mask-image: var(--icon-mask);
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
    }

    .meter-icon::before {
      bottom: 0;
      height: var(--fill);
      background: var(--icon-ink);
    }

    .meter-icon::after {
      top: 0;
      height: var(--empty);
      background: #fff;
    }

    .board {
      background: var(--panel-mid);
      padding: 12px 12px 10px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      pointer-events: none; /* 整块固定 */
    }

    .story-text {
      color: var(--ink);
      text-align: center;
      line-height: 1.6;
      white-space: pre-line;
      font-size: clamp(16px, 1.05vw, 22px);
      min-height: 92px;
      display: grid;
      place-items: center;
      padding: 4px 4px;
    }

    /* 只有这块可拖动 */
    .visual-wrap {
      pointer-events: auto;
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,.15);
      overflow: hidden;
      background: #fff;
      touch-action: none;
      user-select: none;
      transition: transform .16s ease, opacity .16s ease;
      transform: translateX(0) rotate(0deg);
    }

    #cardImage {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      background: #fff;
    }

    .hint {
      color: #555;
      text-align: center;
      font-size: 14px;
    }

    .result {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      z-index: 100;
      background: rgba(0,0,0,.52);
      backdrop-filter: blur(4px);
    }
    .result.show { display: grid; }

    .result-card {
      width: min(620px, 92vw);
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.2);
      padding: 22px;
      text-align: center;
      background: rgba(12,20,24,.94);
      color: #fff;
    }

    .result-icon {
      width: 128px;
      height: 128px;
      object-fit: contain;
      margin: 0 auto 10px;
      display: block;
    }

    .type-code {
      font-size: clamp(50px, 6vw, 76px);
      line-height: 1;
      margin: 6px 0 12px;
    }
  </style>
</head>
<body>
  <section class="menu" id="menu">
    <div class="menu-card">
      <h1>死神值班</h1>
      <p>左右拖动中间图片进行裁决</p>
      <button id="startBtn">开始</button>
    </div>
  </section>

  <main class="game" id="game" hidden>
    <div class="stage">
      <div class="choice-bars">
        <div class="side-choice side-left" id="leftChoice"></div>
        <div class="side-choice side-right" id="rightChoice"></div>
      </div>

      <div class="panel">
        <header class="top-bar">
          <div class="top-icons" id="topIcons"></div>
        </header>

        <section class="board">
          <div class="story-text" id="body"></div>
          <div class="visual-wrap" id="visualDrag">
            <img id="cardImage" src="./assets/card/card_1.png" alt="card" />
          </div>
          <div class="hint">向左 / 向右拖动图片选择</div>
        </section>

        <footer class="bottom-bar" id="lastChoice">等待你的第一次选择</footer>
      </div>
    </div>
  </main>

  <section class="result" id="result">
    <div class="result-card">
      <img class="result-icon" id="resultIcon" src="./assets/icon_type/icon_type_QSNR.png" alt="result" />
      <div class="type-code" id="resultCode">----</div>
      <div id="typeNameCn">未命名类型</div>
      <div id="typeSlogan"></div>
      <div id="typeSubline"></div>
      <div id="typeQuickread"></div>
      <button id="restartBtn">再来一次</button>
    </div>
  </section>

  <script>
    const CONFIG_URLS = [
      "submissions/shinigami/config/shinigami_story_config.json",
      "shinigami_story_config.json"
    ];
    const TYPE_CONFIG_URLS = [
      "submissions/shinigami/config/shinigami_16types_config.csv",
      "submissions/shinigami/config/shinigami_16types_config",
      "shinigami_16types_config.csv"
    ];

    const AXIS_KEYS = ["QI", "SP", "FN", "RB"];
    const AXES = {
      QI: { score: 0 }, SP: { score: 0 }, FN: { score: 0 }, RB: { score: 0 }
    };

    const SWIPE_THRESHOLD = 140;
    const IMG_EXTS = [".png", ".jpg", ".jpeg", ".jfif", ".webp"];
    const ICON_BASES = ["./assets/4icon/icon_1","./assets/4icon/icon_2","./assets/4icon/icon_3","./assets/4icon/icon_4"];
    const CARD_IMAGE_FALLBACK = "./assets/card/card_1.png";
    const RESULT_ICON_BASE = "./assets/icon_type/icon_type_";
    const SCENE_BASE_BY_RANGE = { s1:"./assets/scene/scene_01", s2:"./assets/scene/scene_02", s3:"./assets/scene/scene_03", s4:"./assets/scene/scene_04" };

    const els = {
      menu: document.getElementById("menu"),
      startBtn: document.getElementById("startBtn"),
      game: document.getElementById("game"),
      topIcons: document.getElementById("topIcons"),
      visualDrag: document.getElementById("visualDrag"),
      body: document.getElementById("body"),
      cardImage: document.getElementById("cardImage"),
      leftChoice: document.getElementById("leftChoice"),
      rightChoice: document.getElementById("rightChoice"),
      lastChoice: document.getElementById("lastChoice"),
      result: document.getElementById("result"),
      resultIcon: document.getElementById("resultIcon"),
      resultCode: document.getElementById("resultCode"),
      typeNameCn: document.getElementById("typeNameCn"),
      typeSlogan: document.getElementById("typeSlogan"),
      typeSubline: document.getElementById("typeSubline"),
      typeQuickread: document.getElementById("typeQuickread"),
      restartBtn: document.getElementById("restartBtn")
    };

    let cards = [];
    let typeMap = {};
    let idx = 0;
    let dragging = false;
    let startX = 0;
    let offsetX = 0;

    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
    const getTypeCode = () => (AXES.QI.score >= 0 ? "Q" : "I") + (AXES.SP.score >= 0 ? "S" : "P") + (AXES.FN.score >= 0 ? "F" : "N") + (AXES.RB.score >= 0 ? "R" : "B");
    const axisFillPercent = (score) => clamp(50 + (clamp(score, -60, 60) / 60) * 50, 0, 100);

    function updateIconMeters() {
      AXIS_KEYS.forEach((k, i) => {
        const el = document.getElementById(`meter${i}`);
        if (!el) return;
        el.style.setProperty("--fill", `${axisFillPercent(AXES[k].score)}%`);
      });
    }

    async function pickFirstImageUrl(candidates) {
      for (const url of candidates) {
        try { const r = await fetch(url, { method: "HEAD", cache: "no-store" }); if (r.ok) return url; } catch (_) {}
      }
      return "";
    }

    async function setImgByCandidates(imgEl, candidates, fallback = "") {
      const url = await pickFirstImageUrl(candidates);
      imgEl.src = url || fallback;
    }

    async function setBgByBase(base) {
      const url = await pickFirstImageUrl(IMG_EXTS.map((ext) => base + ext));
      if (url) document.documentElement.style.setProperty("--bg-image", `url("${url}")`);
    }

    function cardNumericId(card, index) {
      const n = Number.parseInt(String(card?.id ?? (index + 1)), 10);
      return Number.isNaN(n) ? index + 1 : n;
    }

    function uniqueValues(values) {
      return [...new Set(values.filter(Boolean))];
    }

    function normalizeAssetPath(value) {
      const normalized = String(value || "").trim().replace(/\\/g, "/");
      if (!normalized) return "";
      if (normalized.startsWith("./") || normalized.startsWith("../") || normalized.startsWith("http")) return normalized;
      if (normalized.startsWith("assets/")) return `./${normalized}`;
      return normalized;
    }

    function cardImageCandidates(card, index) {
      const rawValues = [card?.imagePath, card?.imageName, card?.image];
      if (!rawValues.some((value) => String(value || "").trim())) {
        rawValues.push(`card_${cardNumericId(card, index)}`);
      }

      const candidates = [];
      rawValues.forEach((rawValue) => {
        const normalized = normalizeAssetPath(rawValue);
        if (!normalized) return;

        const fileName = normalized.split("/").pop();
        const hasExtension = /\.[a-z0-9]{2,5}$/i.test(fileName);

        if (hasExtension) {
          candidates.push(normalized);
          if (!normalized.includes("/assets/card/")) {
            candidates.push(`./assets/card/${fileName}`);
          }
          return;
        }

        IMG_EXTS.forEach((ext) => {
          candidates.push(`./assets/card/${fileName}${ext}`);
        });
      });

      return uniqueValues(candidates);
    }

    function sceneBaseById(card, index) {
      const id = cardNumericId(card, index);
      if (id <= 8) return SCENE_BASE_BY_RANGE.s1;
      if (id <= 16) return SCENE_BASE_BY_RANGE.s2;
      if (id <= 24) return SCENE_BASE_BY_RANGE.s3;
      return SCENE_BASE_BY_RANGE.s4;
    }

    async function renderTopIcons() {
      els.topIcons.innerHTML = ICON_BASES.map((_, i) =>
        `<div class="meter-icon" id="meter${i}"></div>`
      ).join("");

      for (let i = 0; i < ICON_BASES.length; i++) {
        const url = await pickFirstImageUrl(ICON_BASES[i]);
        const el = document.getElementById(`meter${i}`);
        if (el && url) {
          el.style.setProperty("--icon-mask", `url("${url}")`);
        }
      }

      updateIconMeters();
    }

    function parseCSV(text) {
      const src = String(text || "").replace(/^\uFEFF/, "");
      const rows = []; let row = []; let cell = ""; let quote = false;
      for (let i = 0; i < src.length; i++) {
        const ch = src[i], next = src[i + 1];
        if (quote) {
          if (ch === "\"" && next === "\"") { cell += "\""; i++; }
          else if (ch === "\"") quote = false;
          else cell += ch;
        } else {
          if (ch === "\"") quote = true;
          else if (ch === ",") { row.push(cell); cell = ""; }
          else if (ch === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
          else if (ch !== "\r") cell += ch;
        }
      }
      row.push(cell); if (row.length > 1 || row[0] !== "") rows.push(row);
      return rows;
    }

    const normKey = (v) => String(v || "").trim().toLowerCase().replace(/\s+/g, "_");
    function pickField(obj, keys, fallback = "") {
      const aliases = keys.map(normKey);
      for (const k of Object.keys(obj)) if (aliases.includes(normKey(k))) return obj[k];
      return fallback;
    }

    function buildTypeMap(csvText) {
      const rows = parseCSV(csvText); if (!rows.length) return {};
      const headers = rows[0].map((h) => String(h || "").trim()); const map = {};
      for (let i = 1; i < rows.length; i++) {
        const cols = rows[i]; if (!cols.length) continue;
        const rowObj = {}; headers.forEach((h, idx) => { rowObj[h] = String(cols[idx] ?? "").trim(); });
        const code = pickField(rowObj, ["type_code", "code", "type", "mbti"]).toUpperCase(); if (!code) continue;
        map[code] = {
          type_name_cn: pickField(rowObj, ["type_name_cn", "name_cn", "name", "title"]),
          slogan: pickField(rowObj, ["slogan"]),
          subline: pickField(rowObj, ["subline"]),
          quickread_body: pickField(rowObj, ["quickread_body", "quickread", "desc", "description"])
        };
      }
      return map;
    }

    async function fetchFirstText(candidates) {
      const errors = [];
      for (const url of candidates) {
        try { const r = await fetch(url, { cache: "no-store" }); if (r.ok) return await r.text(); errors.push(`${url}:${r.status}`); }
        catch (e) { errors.push(`${url}:${e.message}`); }
      }
      throw new Error(`文本加载失败：${errors.join(" | ")}`);
    }

    async function fetchFirstJSON(candidates) {
      const errors = [];
      for (const url of candidates) {
        try { const r = await fetch(url, { cache: "no-store" }); if (r.ok) return await r.json(); errors.push(`${url}:${r.status}`); }
        catch (e) { errors.push(`${url}:${e.message}`); }
      }
      throw new Error(`JSON 加载失败：${errors.join(" | ")}`);
    }

    function getTypeMeta(code) {
      return typeMap[code] || { type_name_cn: "未命名类型", slogan: "", subline: "", quickread_body: "" };
    }

    async function renderCard() {
      if (idx >= cards.length) return finishGame();
      const card = cards[idx], left = card.left || {}, right = card.right || {};
      els.body.textContent = [card.title || "", card.body || card.text || ""].filter(Boolean).join("\n\n");
      els.leftChoice.textContent = left.label || "向左";
      els.rightChoice.textContent = right.label || "向右";

      els.leftChoice.style.opacity = "0.5";
      els.rightChoice.style.opacity = "0.5";
      els.leftChoice.style.transform = "translateY(-50%) translateX(0px)";
      els.rightChoice.style.transform = "translateY(-50%) translateX(0px)";

      els.visualDrag.style.opacity = "1";
      els.visualDrag.style.transform = "translateX(0px) rotate(0deg)";

      await Promise.all([
        setImgByCandidates(els.cardImage, cardImageCandidates(card, idx), CARD_IMAGE_FALLBACK),
        setBgByBase(sceneBaseById(card, idx))
      ]);
    }

    function applyEffects(effects = {}) {
      AXIS_KEYS.forEach((k) => { AXES[k].score += Number(effects[k] || 0); });
      updateIconMeters();
    }

    function choose(side) {
      const card = cards[idx]; if (!card) return;
      const choice = side === "left" ? (card.left || {}) : (card.right || {});
      applyEffects(choice.effects || {});
      els.lastChoice.textContent = `上个选项：${choice.label || "未命名选择"}`;

      const dir = side === "left" ? -1 : 1;
      els.visualDrag.style.transform = `translateX(${dir * (window.innerWidth * 0.45)}px) rotate(${dir * 14}deg)`;
      els.visualDrag.style.opacity = "0";

      setTimeout(async () => { idx++; await renderCard(); }, 150);
    }

    function onDragStart(x) {
      if (els.result.classList.contains("show")) return;
      dragging = true; startX = x; offsetX = 0;
      els.visualDrag.style.transition = "none";
    }

    function onDragMove(x) {
      if (!dragging) return;
      offsetX = x - startX;
      const bias = clamp(offsetX / SWIPE_THRESHOLD, -1, 1);
      els.visualDrag.style.transform = `translateX(${offsetX}px) rotate(${bias * 8}deg)`;

      const leftAlpha = clamp(0.5 - 0.5 * bias, 0, 1);
      const rightAlpha = clamp(0.5 + 0.5 * bias, 0, 1);
      els.leftChoice.style.opacity = `${leftAlpha}`;
      els.rightChoice.style.opacity = `${rightAlpha}`;

      const retreat = 86;
      els.leftChoice.style.transform = `translateY(-50%) translateX(${bias < 0 ? -Math.abs(bias) * retreat : 0}px)`;
      els.rightChoice.style.transform = `translateY(-50%) translateX(${bias > 0 ? Math.abs(bias) * retreat : 0}px)`;
    }

    function onDragEnd() {
      if (!dragging) return;
      dragging = false;
      els.visualDrag.style.transition = "transform .16s ease, opacity .16s ease";
      if (Math.abs(offsetX) >= SWIPE_THRESHOLD) return choose(offsetX < 0 ? "left" : "right");

      els.visualDrag.style.transform = "translateX(0px) rotate(0deg)";
      els.leftChoice.style.opacity = "0.5";
      els.rightChoice.style.opacity = "0.5";
      els.leftChoice.style.transform = "translateY(-50%) translateX(0px)";
      els.rightChoice.style.transform = "translateY(-50%) translateX(0px)";
    }

    async function finishGame() {
      const code = getTypeCode(), meta = getTypeMeta(code);
      await setImgByBase(els.resultIcon, RESULT_ICON_BASE + code, els.resultIcon.src);
      els.resultCode.textContent = code;
      els.typeNameCn.textContent = meta.type_name_cn || "未命名类型";
      els.typeSlogan.textContent = meta.slogan || "";
      els.typeSubline.textContent = meta.subline || "";
      els.typeQuickread.textContent = meta.quickread_body || "";
      els.result.classList.add("show");
    }

    async function resetGame() {
      AXIS_KEYS.forEach((k) => { AXES[k].score = 0; });
      updateIconMeters();
      idx = 0;
      els.result.classList.remove("show");
      els.lastChoice.textContent = "等待你的第一次选择";
      await renderCard();
    }

    function bindEvents() {
      els.startBtn.addEventListener("click", () => { els.menu.hidden = true; els.game.hidden = false; });
      els.restartBtn.addEventListener("click", resetGame);

      els.visualDrag.addEventListener("pointerdown", (e) => {
        els.visualDrag.setPointerCapture(e.pointerId);
        onDragStart(e.clientX);
      });
      els.visualDrag.addEventListener("pointermove", (e) => onDragMove(e.clientX));
      els.visualDrag.addEventListener("pointerup", onDragEnd);
      els.visualDrag.addEventListener("pointercancel", onDragEnd);

      window.addEventListener("keydown", (e) => {
        if (els.result.classList.contains("show")) return;
        if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") choose("left");
        if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") choose("right");
      });
    }

    async function init() {
      bindEvents();
      await renderTopIcons();
      await setBgByBase(SCENE_BASE_BY_RANGE.s1);

      try {
        const [storyConfig, typeCsv] = await Promise.all([fetchFirstJSON(CONFIG_URLS), fetchFirstText(TYPE_CONFIG_URLS)]);
        cards = Array.isArray(storyConfig.cards) ? storyConfig.cards : [];
        typeMap = buildTypeMap(typeCsv);
        await resetGame();
      } catch (e) {
        els.body.textContent = e.message;
      }
    }

    init();
  </script>
</body>
</html>
