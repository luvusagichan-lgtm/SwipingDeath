<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>死神值班：电车裁决</title>
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #1b1f2a;
      --text: #edf5ef;
      --muted: #a8b6b6;
      --left: #38598c;
      --right: #8a2e24;
      --accent: #b8ebe0;
      --border: #2a3040;
      --paper: #d8d0b7;
      --paper-ink: #2a261f;
      --paper-border: #4b4335;
      --gold: #e7b84a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #08090b;
      color: var(--text);
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .app {
      width: min(860px, 100%);
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr;
    }

    .menu {
      min-height: 520px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background:
        linear-gradient(170deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01)),
        radial-gradient(circle at 50% 10%, rgba(213, 183, 110, 0.12), transparent 52%),
        #11151a;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 18px;
      padding: 36px;
      text-align: center;
    }

    .menu h1 {
      margin: 0;
      font-size: clamp(30px, 6vw, 56px);
      line-height: 1.1;
    }

    .menu p {
      margin: 0;
      max-width: 560px;
      color: var(--muted);
      line-height: 1.7;
      white-space: pre-line;
    }

    .start-button {
      min-width: 180px;
      padding: 14px 20px;
      border-color: rgba(255, 212, 59, 0.45);
      background: #1e2430;
      font-size: 18px;
    }

    .game-shell {
      position: fixed;
      inset: 0;
      display: block;
      overflow: hidden;
      background: #08090b;
    }

    .menu[hidden],
    .game-shell[hidden] {
      display: none;
    }

    .world-canvas,
    .veil {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .world-canvas {
      z-index: 0;
    }

    .veil {
      z-index: 1;
      background:
        linear-gradient(rgba(28, 32, 32, 0.24), rgba(23, 23, 21, 0.32)),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.018) 0 1px, transparent 1px 6px);
      pointer-events: none;
    }

    .topbar {
      position: absolute;
      z-index: 4;
      top: 26px;
      left: 56px;
      right: 160px;
      display: grid;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
      pointer-events: none;
    }

    .hud-header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: end;
      gap: 18px;
    }

    .progress-label {
      color: #e4ddc9;
      font-size: 28px;
      line-height: 1.1;
      font-weight: 700;
    }

    .omen-label {
      color: #c3baa2;
      font-size: 18px;
      text-align: right;
    }

    .stat-row {
      display: flex;
      align-items: center;
      gap: 20px;
      opacity: 0;
      transition: opacity 900ms ease;
    }

    .stat-row.stats-visible {
      opacity: 1;
    }

    .stat-card {
      min-width: 0;
      display: grid;
      grid-template-columns: 30px 7px;
      align-items: center;
      gap: 7px;
      border: 0;
      border-radius: 0;
      background: transparent;
      padding: 0;
    }

    .stat-icon {
      position: relative;
      display: block;
      width: 30px;
      height: 30px;
      color: var(--gold);
      opacity: 0.92;
    }

    .stat-icon::before,
    .stat-icon::after {
      content: "";
      position: absolute;
      box-sizing: border-box;
    }

    .icon-order::before {
      left: 7px;
      top: 5px;
      width: 16px;
      height: 18px;
      border: 3px solid currentColor;
      border-top-width: 5px;
      transform: skewX(-8deg);
    }

    .icon-order::after {
      left: 4px;
      top: 23px;
      width: 22px;
      height: 3px;
      background: currentColor;
    }

    .icon-fear::before {
      left: 3px;
      top: 8px;
      width: 24px;
      height: 15px;
      border: 3px solid currentColor;
      border-radius: 50% / 58%;
    }

    .icon-fear::after {
      left: 12px;
      top: 12px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .icon-mercy::before {
      left: 8px;
      top: 11px;
      width: 14px;
      height: 14px;
      background: currentColor;
      transform: rotate(45deg);
    }

    .icon-mercy::after {
      left: 5px;
      top: 5px;
      width: 20px;
      height: 14px;
      background:
        radial-gradient(circle at 30% 50%, currentColor 0 7px, transparent 7px),
        radial-gradient(circle at 70% 50%, currentColor 0 7px, transparent 7px);
    }

    .icon-coin::before {
      left: 5px;
      top: 5px;
      width: 20px;
      height: 20px;
      border: 3px solid currentColor;
      border-radius: 50%;
      background: rgba(231, 184, 74, 0.16);
    }

    .icon-coin::after {
      left: 14px;
      top: 9px;
      width: 3px;
      height: 12px;
      background: currentColor;
    }

    .stat-track {
      position: relative;
      width: 7px;
      height: 30px;
      overflow: hidden;
      border-radius: 0;
      background: rgba(14, 15, 16, 0.68);
      border: 1px solid rgba(216, 208, 183, 0.28);
    }

    .stat-fill {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: block;
      height: 50%;
      width: 100%;
      background: var(--gold);
      transition: height 180ms ease;
    }

    .audio-toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 20;
      width: 92px;
      padding: 10px 12px;
      border-radius: 999px;
      font-size: 13px;
      color: var(--text);
      background: rgba(22, 27, 37, 0.92);
      backdrop-filter: blur(10px);
    }

    .audio-toggle[aria-pressed="false"] {
      color: var(--muted);
    }

    .board {
      position: absolute;
      z-index: 3;
      inset: 0;
      overflow: visible;
      border: 0;
      background: transparent;
      pointer-events: none;
    }

    .card {
      position: absolute;
      left: 50%;
      top: max(150px, calc(50% - 250px));
      width: min(520px, calc(100vw - 36px));
      height: min(560px, calc(100vh - 188px));
      border-radius: 2px;
      border: 2px solid var(--paper-border);
      background: var(--paper);
      padding: 20px 26px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      cursor: grab;
      user-select: none;
      transform: translateX(-50%);
      transform-origin: 50% 50%;
      transition: transform 180ms ease, opacity 180ms ease;
      touch-action: none;
      pointer-events: auto;
      box-shadow: 0 10px 0 rgba(0, 0, 0, 0.16);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(35deg, rgba(255,255,255,0.035) 0 1px, transparent 1px 7px),
        repeating-linear-gradient(125deg, rgba(0,0,0,0.018) 0 1px, transparent 1px 9px);
      mix-blend-mode: multiply;
    }

    .card h2 {
      margin: 0;
      color: #201d18;
      font-size: 28px;
      line-height: 1.35;
      text-align: center;
      font-weight: 700;
    }

    .card p {
      margin: 0;
      color: var(--paper-ink);
      line-height: 1.58;
      font-size: 20px;
      white-space: pre-line;
      flex: 1;
      overflow: hidden;
      display: flex;
      align-items: center;
    }

    .card-tag {
      display: none;
      color: #6b5b45;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .card-illustration {
      width: 100%;
      height: 240px;
      flex: 0 0 240px;
      display: block;
      image-rendering: auto;
    }

    .choice-hint {
      position: absolute;
      z-index: 2;
      left: 0;
      right: 0;
      top: max(358px, calc(50% + 26px));
      height: 132px;
      pointer-events: none;
      font-size: 17px;
      color: #fff;
    }

    .choice-hint span {
      position: absolute;
      top: 0;
      width: clamp(136px, 15vw, 184px);
      min-height: 132px;
      border-radius: 2px;
      display: grid;
      place-items: center;
      padding: 8px;
      text-align: center;
      white-space: pre-line;
      transition: opacity 120ms ease, transform 120ms ease;
      border: 2px solid rgba(42, 38, 31, 0.22);
      opacity: 0.42;
    }

    #leftChoice {
      left: max(18px, calc(50% - 436px));
      background: #3e617d;
    }

    #rightChoice {
      right: max(18px, calc(50% - 436px));
      background: #9c4436;
    }

    .left-flag, .right-flag {
      display: none;
    }

    .card-hint {
      color: #8b806a;
      font-size: 16px;
      text-align: center;
    }

    .hint-left { color: #3e617d; font-weight: 700; }
    .hint-right { color: #9c4436; font-weight: 700; }

    .outcome {
      position: absolute;
      z-index: 4;
      left: 80px;
      right: 80px;
      bottom: 22px;
      min-height: 54px;
      color: #d8d0b7;
      font-size: 18px;
      line-height: 1.5;
      text-align: center;
      pointer-events: none;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      border: 1px solid var(--border);
      background: #242622;
      color: var(--text);
      border-radius: 2px;
      padding: 12px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.06); }

    .axis {
      display: none;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      background: rgba(0,0,0,0.15);
      gap: 10px;
    }

    .axis-row {
      display: grid;
      grid-template-columns: 122px 1fr 122px;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .bar {
      position: relative;
      height: 8px;
      border-radius: 999px;
      background: #111621;
      overflow: hidden;
    }

    .bar-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 0;
      transform: translateX(-50%);
      background: linear-gradient(90deg, #74c0fc, #ff8787);
      transition: width 200ms ease;
    }

    .result {
      border: 1px solid var(--border);
      border-radius: 2px;
      background:
        repeating-linear-gradient(35deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 7px),
        #22251f;
      padding: 18px;
      display: none;
      gap: 10px;
      position: relative;
      z-index: 8;
    }

    .result.show { display: grid; }

<body>
  <button class="audio-toggle" id="musicToggle" aria-pressed="true">音乐 ON</button>
  <main class="app">
    <section class="menu" id="mainMenu">
      <div class="muted">Death Shift Personality Test</div>
      <h1>死神值班</h1>
      <p>在人类生死之间刷卡。
每一次选择，都会被记录。</p>
      <button class="start-button" id="startBtn">开始游戏</button>
    </section>

    <section class="game-shell" id="gameShell" hidden>
      <canvas class="world-canvas" id="worldCanvas" aria-hidden="true"></canvas>
      <div class="veil" aria-hidden="true"></div>

      <div class="topbar">
        <div class="hud-header">
          <div class="progress-label" id="progress">第 1 夜</div>
          <div class="omen-label" id="omen">亡者排队，生者等候</div>
        </div>
        <div class="stat-row" id="godotStats">
          <div class="stat-card" data-stat="秩序" title="秩序"><span class="stat-icon icon-order" aria-hidden="true"></span><div class="stat-track"><span class="stat-fill"></span></div></div>
          <div class="stat-card" data-stat="恐惧" title="恐惧"><span class="stat-icon icon-fear" aria-hidden="true"></span><div class="stat-track"><span class="stat-fill"></span></div></div>
          <div class="stat-card" data-stat="怜悯" title="怜悯"><span class="stat-icon icon-mercy" aria-hidden="true"></span><div class="stat-track"><span class="stat-fill"></span></div></div>
          <div class="stat-card" data-stat="冥币" title="冥币"><span class="stat-icon icon-coin" aria-hidden="true"></span><div class="stat-track"><span class="stat-fill"></span></div></div>
        </div>
      </div>

      <section class="board" id="board">
        <div class="choice-hint">
          <span id="leftChoice"></span>
          <span id="rightChoice"></span>
        </div>
        <article class="card" id="card">
          <div class="left-flag" id="leftFlag"></div>
          <div class="right-flag" id="rightFlag"></div>
          <canvas class="card-illustration" id="cardIllustration" aria-hidden="true"></canvas>
          <div class="card-tag" id="tag"></div>
          <h2 id="title"></h2>
          <p id="body"></p>
          <div class="card-hint" id="cardHint">拖动卡片：<span class="hint-left">左滑</span> 或 <span class="hint-right">右滑</span> 作出判决</div>
        </article>
      </section>

      <div class="outcome" id="outcome"></div>

      <div class="controls" id="gameControls">
        <button id="btnLeft"></button>
        <button id="btnRight"></button>
      </div>

      <section class="axis" id="axisBoard"></section>
    </section>

    <section class="result" id="result">
      <div class="muted">人格结算</div>
      <h3 id="typeName"></h3>
      <div id="typeCode"></div>
      <p id="typeDesc"></p>
      <div class="share" id="shareText"></div>
      <div class="controls">
        <button id="copyBtn">复制分享文案</button>
        <button id="restartBtn">再值一次班</button>
      </div>
    </section>
  </main>

    ];
    const GODOT_STAT_BASE = { "秩序": 50, "恐惧": 36, "怜悯": 42, "冥币": 30 };
    const sfxPool = SFX.cardMotion.map((sfx) => {

    const SWIPE_THRESHOLD = 170;

    ];
    let branchVisitState = {};

    function clamp(v, min, max) {
      return Math.min(max, Math.max(min, v));
    }

    function rgba(color, alpha = 1) {
      return `rgba(${color[0]}, ${color[1]}, ${color[2]}, ${alpha})`;
    }

    function mixColor(a, b, t) {
      return [
        Math.round(a[0] + (b[0] - a[0]) * t),
        Math.round(a[1] + (b[1] - a[1]) * t),
        Math.round(a[2] + (b[2] - a[2]) * t)
      ];
    }

    function resizeCanvas(canvas) {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const width = Math.max(1, Math.round(rect.width * dpr));
      const height = Math.max(1, Math.round(rect.height * dpr));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { ctx, w: rect.width, h: rect.height };
    }

    function polygon(ctx, points, fill) {
      ctx.beginPath();
      points.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
    }

    function strokeArc(ctx, x, y, radius, start, end, color, width) {
      ctx.beginPath();
      ctx.arc(x, y, radius, start, end);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.stroke();
    }

    function drawMoon(ctx, x, y, radius, color, sky) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = sky;
      ctx.beginPath();
      ctx.arc(x + radius * 0.35, y - radius * 0.14, radius * 0.88, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawCity(ctx, w, h, base, light) {
      for (let i = 0; i < 9; i += 1) {
        const x = w * (i * 0.13 - 0.04);
        const bw = w * 0.10;
        const bh = h * (0.20 + 0.06 * (i % 4));
        ctx.fillStyle = base;
        ctx.fillRect(x, h * 0.58 - bh, bw, bh);
        ctx.fillStyle = light;
        ctx.fillRect(x + bw * 0.25, h * 0.49, bw * 0.12, h * 0.035);
        ctx.fillRect(x + bw * 0.62, h * 0.42, bw * 0.12, h * 0.035);
      }
    }

    function drawRain(ctx, w, h) {
      ctx.strokeStyle = "rgba(218, 218, 207, .42)";
      ctx.lineWidth = 4;
      ctx.lineCap = "round";
      for (let i = 0; i < 34; i += 1) {
        const x = (i * 89) % (w + 120) - 60;
        const y = (i * 47) % (h * 0.7);
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x - 24, y + 72);
        ctx.stroke();
      }
      ctx.lineCap = "butt";
    }

    function drawLightning(ctx, w, h, x, scale = 1) {
      polygon(ctx, [
        [x, -20 * scale],
        [x - 52 * scale, 150 * scale],
        [x - 8 * scale, 136 * scale],
        [x - 78 * scale, 330 * scale],
        [x + 38 * scale, 112 * scale],
        [x - 14 * scale, 126 * scale],
        [x + 42 * scale, -24 * scale]
      ], "rgba(231, 184, 74, .94)");
    }

    function drawFlatClouds(ctx, w, h) {
      ctx.fillStyle = "rgba(55, 59, 58, .72)";
      for (let row = 0; row < 2; row += 1) {
        const y = h * (0.06 + row * 0.12);
        for (let i = -1; i < 9; i += 1) {
          ctx.beginPath();
          ctx.arc(w * (i * 0.15 + 0.05), y, h * 0.075, Math.PI, 0);
          ctx.arc(w * (i * 0.15 + 0.12), y + 8, h * 0.06, Math.PI, 0);
          ctx.rect(w * (i * 0.15 - 0.02), y, w * 0.22, h * 0.08);
          ctx.fill();
        }
      }
    }

    function renderGodotBackground(sceneVisual = currentVisual) {
      if (!sceneVisual || !els.worldCanvas) return;
      const { ctx, w, h } = resizeCanvas(els.worldCanvas);
      const scene = sceneVisual.scene || "court";
      const sky = sceneVisual.sky || [31, 38, 46];
      const ground = sceneVisual.ground || [51, 46, 36];
      ctx.clearRect(0, 0, w, h);
      const flatSky = mixColor(sky, [116, 111, 101], 0.34);
      const flatGround = mixColor(ground, [118, 106, 88], 0.28);
      ctx.fillStyle = rgba(flatSky);
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = rgba(flatGround);
      ctx.fillRect(0, h * 0.56, w, h * 0.44);
      drawFlatClouds(ctx, w, h);
      drawLightning(ctx, w, h, w * 0.20, 0.95);
      drawLightning(ctx, w, h, w * 0.64, 0.82);
      drawRain(ctx, w, h);

      if (scene === "field") {
        drawMoon(ctx, w * 0.16, h * 0.18, 46, "rgba(240,209,122,.82)", rgba(sky));
        for (let i = 0; i < 28; i += 1) {
          const x = w * (i / 27);
          ctx.strokeStyle = "rgba(179,138,51,.74)";
          ctx.lineWidth = 4;
          ctx.beginPath(); ctx.moveTo(x, h * 0.60); ctx.lineTo(x - 28, h); ctx.stroke();
          ctx.strokeStyle = "rgba(235,189,77,.48)";
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(x + 8, h * 0.62); ctx.lineTo(x + 34, h); ctx.stroke();
        }
      } else if (scene === "plague") {
        drawCity(ctx, w, h, "rgba(18,26,26,.95)", "rgba(133,179,148,.34)");
        for (let i = 0; i < 18; i += 1) {
          ctx.fillStyle = "rgba(140,199,153,.20)";
          ctx.beginPath();
          ctx.arc(w * ((i * 0.17) % 1), h * (0.64 + ((i * 0.11) % 0.22)), 10, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (scene === "mine") {
        for (let i = 0; i < 10; i += 1) {
          const x = w * (i * 0.11 - 0.08);
          polygon(ctx, [[x, h], [x + w * 0.13, h * (0.34 + 0.05 * (i % 3))], [x + w * 0.28, h]], "rgba(10,13,15,.92)");
        }
        ctx.strokeStyle = "rgba(173,133,71,.72)";
        ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(w * 0.08, h * 0.66); ctx.lineTo(w * 0.92, h * 0.66); ctx.stroke();
      } else if (scene === "palace") {
        drawMoon(ctx, w * 0.84, h * 0.18, 40, "rgba(189,204,250,.86)", rgba(sky));
        for (let i = 0; i < 5; i += 1) {
          const x = w * (0.08 + i * 0.19);
          ctx.fillStyle = "rgba(46,36,64,.94)";
          ctx.fillRect(x, h * 0.30, w * 0.11, h * 0.38);
          polygon(ctx, [[x - 18, h * 0.30], [x + w * 0.055, h * 0.16], [x + w * 0.11 + 18, h * 0.30]], "rgba(79,59,97,.96)");
        }
      } else if (scene === "war") {
        for (let i = 0; i < 13; i += 1) {
          const x = w * (i / 12);
          ctx.strokeStyle = "rgba(15,15,15,.86)";
          ctx.lineWidth = 6;
          ctx.beginPath(); ctx.moveTo(x, h * 0.22); ctx.lineTo(x + 20, h * 0.72); ctx.stroke();
          polygon(ctx, [[x, h * 0.24], [x + 70, h * 0.31], [x + 5, h * 0.43]], "rgba(107,10,10,.78)");
        }
      } else if (scene === "market") {
        drawCity(ctx, w, h, "rgba(46,26,20,.95)", "rgba(242,153,64,.40)");
        ctx.fillStyle = "rgba(138,71,31,.72)";
        ctx.fillRect(0, h * 0.60, w, 10);
      } else if (scene === "grave") {
        drawMoon(ctx, w * 0.20, h * 0.18, 42, "rgba(184,214,214,.84)", rgba(sky));
        for (let i = 0; i < 22; i += 1) {
          const x = w * ((i * 0.13) % 1);
          ctx.fillStyle = "rgba(46,56,54,.78)";
          ctx.fillRect(x, h * (0.62 + 0.10 * (i % 2)), 34, 56);
        }
      } else if (scene === "boat") {
        ctx.fillStyle = "rgba(8,23,38,1)";
        ctx.fillRect(0, h * 0.52, w, h * 0.48);
        for (let i = 0; i < 9; i += 1) {
          ctx.strokeStyle = "rgba(61,122,163,.27)";
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(0, h * (0.58 + i * 0.045)); ctx.lineTo(w, h * (0.56 + i * 0.045)); ctx.stroke();
        }
        polygon(ctx, [[w * 0.12, h * 0.58], [w * 0.72, h * 0.58], [w * 0.62, h * 0.73], [w * 0.22, h * 0.73]], "rgba(26,13,8,.90)");
      } else if (scene === "forge") {
        drawCity(ctx, w, h, "rgba(26,26,31,.95)", "rgba(242,77,31,.48)");
        for (let i = 0; i < 5; i += 1) {
          ctx.fillStyle = "rgba(224,46,20,.14)";
          ctx.beginPath(); ctx.arc(w * (0.58 + i * 0.08), h * 0.30, 42 + i * 8, 0, Math.PI * 2); ctx.fill();
        }
      } else {
        drawCity(ctx, w, h, "rgba(20,20,26,.95)", "rgba(89,107,112,.32)");
      }
      ctx.fillStyle = "rgba(62,58,51,.18)";
      for (let i = 0; i < 80; i += 1) {
        ctx.fillRect((i * 37) % w, (i * 59) % h, 1, 1);
      }
      ctx.fillStyle = "rgba(5,5,8,.26)";
      ctx.fillRect(0, 0, w, h);
    }

    function drawBody(ctx, cx, cy, s, robe, accent, prop) {
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.fillStyle = "rgb(226,184,137)";
      ctx.beginPath(); ctx.arc(cx, cy - 64 * s, 36 * s, 0, Math.PI * 2); ctx.fill();
      polygon(ctx, [
        [cx - 88 * s, cy + 92 * s],
        [cx - 52 * s, cy - 32 * s],
        [cx, cy - 66 * s],
        [cx + 52 * s, cy - 32 * s],
        [cx + 88 * s, cy + 92 * s]
      ], robe);
      ctx.strokeStyle = accent;
      ctx.lineWidth = 5 * s;
      ctx.beginPath(); ctx.moveTo(cx - 52 * s, cy - 8 * s); ctx.lineTo(cx + 52 * s, cy - 8 * s); ctx.stroke();
      ctx.fillStyle = "rgb(13,13,13)";
      ctx.beginPath(); ctx.arc(cx - 12 * s, cy - 72 * s, 4.5 * s, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + 12 * s, cy - 72 * s, 4.5 * s, 0, Math.PI * 2); ctx.fill();

      ctx.strokeStyle = accent;
      ctx.fillStyle = accent;
      if (prop === "crown") {
        polygon(ctx, [[cx - 36 * s, cy - 92 * s], [cx - 16 * s, cy - 122 * s], [cx, cy - 96 * s], [cx + 16 * s, cy - 122 * s], [cx + 36 * s, cy - 92 * s]], accent);
      } else if (prop === "mask") {
        polygon(ctx, [[cx + 10 * s, cy - 64 * s], [cx + 82 * s, cy - 54 * s], [cx + 12 * s, cy - 44 * s]], "rgb(219,209,168)");
      } else if (prop === "lamp") {
        ctx.lineWidth = 6 * s;
        ctx.beginPath(); ctx.moveTo(cx + 44 * s, cy - 8 * s); ctx.lineTo(cx + 106 * s, cy - 42 * s); ctx.stroke();
        ctx.fillStyle = "rgba(255,184,56,.85)";
        ctx.beginPath(); ctx.arc(cx + 116 * s, cy - 48 * s, 18 * s, 0, Math.PI * 2); ctx.fill();
      } else if (prop === "veil") {
        strokeArc(ctx, cx, cy - 68 * s, 54 * s, Math.PI, Math.PI * 2, "rgba(237,224,245,.72)", 12 * s);
      } else if (prop === "helmet") {
        strokeArc(ctx, cx, cy - 66 * s, 39 * s, Math.PI, Math.PI * 2, "rgb(138,143,138)", 14 * s);
        ctx.lineWidth = 6 * s;
        ctx.beginPath(); ctx.moveTo(cx, cy - 104 * s); ctx.lineTo(cx, cy - 136 * s); ctx.stroke();
      } else if (prop === "goblet") {
        ctx.fillRect(cx + 64 * s, cy - 54 * s, 24 * s, 36 * s);
        ctx.lineWidth = 5 * s;
        ctx.beginPath(); ctx.moveTo(cx + 76 * s, cy - 18 * s); ctx.lineTo(cx + 76 * s, cy + 24 * s); ctx.stroke();
      } else if (prop === "flower") {
        for (let i = 0; i < 6; i += 1) {
          ctx.fillStyle = "rgb(235,235,224)";
          ctx.beginPath(); ctx.arc(cx + 70 * s + Math.cos(i) * 12 * s, cy - 48 * s + Math.sin(i) * 12 * s, 7 * s, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = accent;
        ctx.beginPath(); ctx.arc(cx + 70 * s, cy - 48 * s, 8 * s, 0, Math.PI * 2); ctx.fill();
      } else if (prop === "gear") {
        ctx.fillStyle = accent;
        ctx.beginPath(); ctx.arc(cx + 72 * s, cy - 54 * s, 28 * s, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgb(31,38,43)";
        ctx.beginPath(); ctx.arc(cx + 72 * s, cy - 54 * s, 14 * s, 0, Math.PI * 2); ctx.fill();
      } else if (prop === "keys") {
        ctx.lineWidth = 6 * s;
        ctx.beginPath(); ctx.moveTo(cx + 62 * s, cy - 28 * s); ctx.lineTo(cx + 110 * s, cy); ctx.stroke();
        strokeArc(ctx, cx + 118 * s, cy + 8 * s, 13 * s, 0, Math.PI * 2, accent, 4 * s);
      } else if (prop === "scythe") {
        ctx.strokeStyle = "rgba(209,224,230,.9)";
        ctx.lineWidth = 6 * s;
        ctx.beginPath(); ctx.moveTo(cx + 72 * s, cy - 32 * s); ctx.lineTo(cx + 120 * s, cy + 92 * s); ctx.stroke();
        strokeArc(ctx, cx + 116 * s, cy - 52 * s, 62 * s, 205 * Math.PI / 180, 326 * Math.PI / 180, "rgba(209,224,230,.9)", 6 * s);
      }
    }

    function renderCardIllustration(sceneVisual = currentVisual, dragBias = currentDragBias) {
      if (!sceneVisual || !els.cardIllustration) return;
      const { ctx, w, h } = resizeCanvas(els.cardIllustration);
      ctx.clearRect(0, 0, w, h);
      let accent = sceneVisual.accent || [184, 235, 224];
      accent = mixColor(accent, [245, 77, 56], Math.max(dragBias, 0) * 0.45);
      accent = mixColor(accent, [97, 163, 255], Math.max(-dragBias, 0) * 0.45);
      const accentCss = rgba(accent);
      const cx = w * 0.5;
      const cy = h * 0.58;
      const s = clamp(Math.min(w / 300, h / 245), 0.64, 1.05);
      const person = sceneVisual.person || "reaper";
      const props = {
        noble: ["rgb(107,31,41)", "crown"],
        doctor: ["rgb(51,64,59)", "mask"],
        miner: ["rgb(82,59,38)", "lamp"],
        queen: ["rgb(64,38,107)", "veil"],
        soldier: ["rgb(46,61,59)", "helmet"],
        merchant: ["rgb(115,56,31)", "goblet"],
        bride: ["rgb(199,199,179)", "flower"],
        saint: ["rgb(87,92,102)", "gear"],
        warden: ["rgb(28,33,41)", "keys"],
        reaper: ["rgb(15,15,20)", "scythe"]
      };
      if (person === "orphan") {
        drawBody(ctx, cx - 32 * s, cy + 8 * s, s * 0.78, "rgb(56,64,71)", "rgb(166,194,219)", "small");
        drawBody(ctx, cx + 48 * s, cy + 20 * s, s * 0.72, "rgb(69,51,46)", "rgb(199,163,112)", "small");
      } else {
        const [robe, prop] = props[person] || props.reaper;
        drawBody(ctx, cx, cy, s, robe, accentCss, prop);
      }
      ctx.strokeStyle = "rgba(71,65,53,.45)";
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(w * 0.18, h - 4); ctx.lineTo(w * 0.82, h - 4); ctx.stroke();
    }

    function resolveGodotVisual(card) {
      const source = [card?.title, card?.tag, card?.body].filter(Boolean).join(" ");
      const keywordMap = [
        [/导师|带教|新人|岗规|死神/, 0],
        [/三人|一人|数量|电车|群众/, 1],
        [/医生|病|感染|瘟疫|药/, 2],
        [/矿|工人|工厂|机器|齿轮/, 3],
        [/王|后|宫|权|梦/, 4],
        [/军|兵|战|逃|将/, 5],
        [/钱|商|税|账|交易|冥币/, 6],
        [/墓|婚|爱|赦|罪/, 7],
        [/船|河|桥|孤儿|海/, 8],
        [/圣|机械|工坊|修士/, 9],
        [/监狱|审判|终局|规则/, 10]
      ];
      const matched = keywordMap.find(([pattern]) => pattern.test(source));
      const fallbackIndex = Math.abs(Number(card?.sequence ?? idx) || idx) % GODOT_CARD_VISUALS.length;
      return { ...GODOT_CARD_VISUALS[matched ? matched[1] : fallbackIndex] };
    }

    function renderGodotHud() {
      const displayCard = cards[idx] || {};
      const displaySequence = idx >= cards.length ? cards.length : getDisplaySequence(displayCard);
      els.progress.textContent = idx >= cards.length ? "值班结束" : `第 ${displaySequence} 夜`;
      const statsVisible = Number(displaySequence) >= 3 || idx >= cards.length;
      els.godotStats.classList.toggle("stats-visible", statsVisible);
      els.godotStats.style.opacity = statsVisible ? "1" : "0";
      const fearValue = GODOT_STAT_BASE["恐惧"] + Math.abs(axes.SP.score) + Math.max(axes.RB.score, 0) * 0.5;
      const mercyValue = GODOT_STAT_BASE["怜悯"] + Math.max(axes.SP.score, 0) + Math.max(axes.FN.score, 0) * 0.35;
      const coinValue = GODOT_STAT_BASE["冥币"] + Math.max(axes.QI.score, 0) * 0.55 - Math.max(-axes.FN.score, 0) * 0.25;
      const orderValue = GODOT_STAT_BASE["秩序"] + axes.RB.score * 0.55 + axes.QI.score * 0.25;
      const values = {
        "秩序": clamp(orderValue, 0, 100),
        "恐惧": clamp(fearValue, 0, 100),
        "怜悯": clamp(mercyValue, 0, 100),
        "冥币": clamp(coinValue, 0, 100)
      };
      Object.entries(values).forEach(([name, value]) => {
        const node = els.godotStats?.querySelector(`[data-stat="${name}"] .stat-fill`);
        if (node) node.style.height = `${value}%`;
      });
      if (values["恐惧"] > 70) {
        els.omen.textContent = "窗户紧闭，祈祷声很轻";
      } else if (values["怜悯"] > 70) {
        els.omen.textContent = "亡魂学会了喊你的名字";
      } else if (values["冥币"] < 18) {
        els.omen.textContent = "摆渡人敲着空钱袋";
      } else if (values["秩序"] < 25) {
        els.omen.textContent = "法官们开始梦游";
      } else {
        els.omen.textContent = "亡者排队，生者等候";
      }
    }

    function setOutcomeText(text) {
      lastOutcome = text || "";
      els.outcome.textContent = lastOutcome;
    }

    function renderGodotScene(card, dragBias = 0) {

      offsetX = 0;
      offsetY = 0;
      els.card.style.transition = "none";
      els.card.style.transform = "translateX(-50%) rotate(0deg) scale(1.02)";
    }

    function onDragMove(clientX, clientY) {
      if (!dragging) return;
      offsetX = clientX - startX;
      offsetY = (clientY - startY) * 0.16;
      const bias = clamp(offsetX / SWIPE_THRESHOLD, -1, 1);
      const rotate = bias * 8;
      els.card.style.transform = `translate(calc(-50% + ${offsetX}px), ${offsetY}px) rotate(${rotate}deg) scale(1.02)`;
      els.leftChoice.style.opacity = String(0.42 + Math.max(-bias, 0) * 0.58);
      els.rightChoice.style.opacity = String(0.42 + Math.max(bias, 0) * 0.58);
      els.leftChoice.style.transform = `scale(${1 + Math.max(-bias, 0) * 0.04})`;
      els.rightChoice.style.transform = `scale(${1 + Math.max(bias, 0) * 0.04})`;
      renderCardIllustration(currentVisual, bias);

      els.card.classList.toggle("show-left", offsetX < -40);
      els.card.classList.toggle("show-right", offsetX > 40);
    }

    function onDragEnd() {
      if (!dragging) return;
      dragging = false;
      els.card.style.transition = "transform 160ms ease, opacity 160ms ease";
      if (offsetX <= -SWIPE_THRESHOLD) {
        choose("left");
        return;
      }
      if (offsetX >= SWIPE_THRESHOLD) {
        choose("right");
        return;
      }
      els.card.style.transform = "translateX(-50%) rotate(0deg) scale(1)";
      els.leftChoice.style.opacity = "0.42";
      els.rightChoice.style.opacity = "0.42";
      els.leftChoice.style.transform = "scale(1)";
      els.rightChoice.style.transform = "scale(1)";
      renderCardIllustration(currentVisual, 0);
      els.card.classList.remove("show-left", "show-right");
    }

    els.btnLeft.addEventListener("click", () => choose("left"));
    els.btnRight.addEventListener("click", () => choose("right"));
    els.startBtn.addEventListener("click", startGame);
    els.musicToggle.addEventListener("click", toggleMusic);
    els.mainMenu.addEventListener("pointerdown", () => switchBgm("menu", BGM.fadeMs, false), { once: true });

    document.addEventListener("keydown", (e) => {
      if (!gameStarted || idx >= cards.length) return;
      if (["ArrowLeft", "a", "A"].includes(e.key)) choose("left");
      if (["ArrowRight", "d", "D"].includes(e.key)) choose("right");
    });

    els.copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(els.shareText.textContent);
        els.copyBtn.textContent = "已复制";
      } catch {
        els.copyBtn.textContent = "复制失败，请手动复制";
      }
      setTimeout(() => els.copyBtn.textContent = "复制分享文案", 1200);
    });

    els.restartBtn.addEventListener("click", resetGame);

    els.card.addEventListener("pointerdown", (e) => {
      els.card.setPointerCapture(e.pointerId);
      onDragStart(e.clientX, e.clientY);
    });
    els.card.addEventListener("pointermove", (e) => onDragMove(e.clientX, e.clientY));
    els.card.addEventListener("pointerup", onDragEnd);
    els.card.addEventListener("pointercancel", onDragEnd);

    window.addEventListener("resize", () => {
      renderGodotBackground(currentVisual);
      renderCardIllustration(currentVisual, currentDragBias);
    });

    if ("ResizeObserver" in window) {
      const illustrationObserver = new ResizeObserver(() => {
        renderCardIllustration(currentVisual, currentDragBias);
      });
      illustrationObserver.observe(els.cardIllustration);
      illustrationObserver.observe(els.card);
    }

    async function init() {
      try {
        await loadConfigs();
        resetBranchVisitState();
        renderAxes();
        switchBgm("menu", BGM.fadeMs, false);
      } catch (error) {
        els.mainMenu.hidden = true;
        els.gameShell.hidden = false;
        showConfigError(error);
      }
    }

    init();
  </script>
</body>
</html>
