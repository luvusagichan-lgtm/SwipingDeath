<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>死神值班</title>
  <style>
    @font-face {
      font-family: "GameFont";
      src: url("./assets/fonts/GameFont.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      --stage-w: min(100vw, calc(100vh * 16 / 9));
      --stage-h: 100vh;

      --panel-w: min(34%, 430px);
      --bar-h: 84px;

      --panel-top-bottom: #dfe4e5;
      --panel-mid: #f5f3ef;
      --ink: #232323;

      --bg-image: url("./assets/scene/scene_01.png");
      --icon-ink: #0d4e4d;
    }

    * {
      box-sizing: border-box;
      font-family: "GameFont", sans-serif !important;
      font-weight: 400 !important;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101114;
    }

    .menu, .game {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
    }

    .menu {
      z-index: 30;
      background: #000;
    }

    .game {
      background:
        linear-gradient(rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.28)),
        var(--bg-image) center/cover no-repeat;
    }

    .menu[hidden], .game[hidden] { display: none; }

    .menu-card {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 24px;
      font-size: 20px;
      cursor: pointer;
      background: #f2e8d6;
      color: #1f1f1f;
    }

    .audio-toggle {
      position: fixed;
      z-index: 120;
      top: 18px;
      right: 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.36);
      background: rgba(16, 17, 20, 0.72);
      color: #fff;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(8px);
      font-size: 16px;
      line-height: 1;
      padding: 10px 14px;
    }

    .audio-toggle[aria-pressed="false"] {
      color: #d7dce6;
      background: rgba(16, 17, 20, 0.48);
    }

    .menu-bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    .menu-start {
      position: absolute;
      left: 50%;
      top: 73.2%;
      transform: translateX(-50%);
      padding: 10px 30px;
      border-radius: 12px;
      border: 1px solid rgba(116, 156, 255, 0.7);
      background: linear-gradient(90deg, #4a67ff 0%, #6d4dff 100%);
      box-shadow: 0 4px 16px rgba(79, 101, 255, 0.45);
      color: #fff;
      font-size: clamp(26px, 1.9vw, 34px);
      line-height: 1;
      cursor: pointer;
      white-space: nowrap;
      transition: transform .15s ease, filter .15s ease;
      z-index: 2;
    }

    .menu-start:hover {
      transform: translateX(-50%) translateY(-1px);
      filter: brightness(1.06);
    }

    /* 鍥哄畾 16:9 鐢诲竷 */
    .stage {
      position: relative;
      width: var(--stage-w);
      height: var(--stage-h);
      overflow: hidden;
      background: transparent;
    }

    .choice-bars {
      position: absolute;
      inset: 0;
      z-index: 70;
      pointer-events: none;
    }

    .side-choice {
      position: absolute;
      top: 40%;
      height: 42px;
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.85);
      color: #222;
      border-radius: 999px;
      opacity: 1;
      transition: opacity .08s linear, transform .08s linear;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      font-size: clamp(17px, 1.25vw, 24px);
    }

    .side-left {
      right: calc(50% + var(--panel-w) / 2 - 8px);
      width: calc(50% - (var(--panel-w) / 2) - 24px);
      justify-content: flex-end;
      padding: 0 24px;
      transform: translateY(-50%);
    }

    .side-right {
      left: calc(50% + var(--panel-w) / 2 - 8px);
      width: calc(50% - (var(--panel-w) / 2) - 24px);
      justify-content: flex-start;
      padding: 0 24px;
      transform: translateY(-50%);
    }

    .panel {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      width: var(--panel-w);
      height: 100%;
      display: grid;
      grid-template-rows: var(--bar-h) 1fr var(--bar-h);
      z-index: 20;
      pointer-events: none;
      overflow: visible;
    }

    .top-bar,
    .bottom-bar {
      background: var(--panel-top-bottom);
      display: grid;
      align-items: center;
      min-height: var(--bar-h);
      max-height: var(--bar-h);
      padding: 0 14px;
      color: #222;
    }

    .top-bar { border-bottom: 1px solid #c6ccd2; }
    .bottom-bar {
      border-top: 1px solid #c6ccd2;
      place-items: center;
      text-align: center;
      font-size: 14px;
      line-height: 1.25;
      color: #8f949a;
      white-space: normal;
      overflow: hidden;
    }

    .top-icons {
      height: 100%;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-items: center;
      justify-items: center;
      gap: 0;
    }

    .meter-icon {
      position: relative;
      width: 42px;
      height: 42px;
      --fill: 50%;
      background: linear-gradient(
        to bottom,
        #fff 0%,
        #fff calc(100% - var(--fill)),
        var(--icon-ink) calc(100% - var(--fill)),
        var(--icon-ink) 100%
      );
      -webkit-mask-image: var(--icon-mask);
      mask-image: var(--icon-mask);
      -webkit-mask-size: contain;
      mask-size: contain;
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-position: center;
      mask-position: center;
    }

    .board {
      background: var(--panel-mid);
      padding: 12px 12px 10px;
      display: grid;
      grid-template-rows: 1fr auto auto;
      gap: 10px;
      pointer-events: none; /* 鏁村潡鍥哄畾 */
      min-height: 0;
      overflow: visible;
    }

    .story-text {
      color: var(--ink);
      text-align: justify;
      text-align-last: center;
      line-height: 1.5;
      white-space: pre-line;
      font-size: clamp(16px, 1.05vw, 22px);
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      padding: 4px 4px;
      overflow: hidden;
    }

    /* 鍙湁杩欏潡鍙嫋鍔?*/
    .visual-wrap {
      pointer-events: auto;
      width: 80%;
      aspect-ratio: 1 / 1;
      justify-self: center;
      align-self: start;
      margin-top: -14px;
      position: relative;
      z-index: 2;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,.15);
      overflow: hidden;
      background: #fff;
      touch-action: none;
      user-select: none;
      transition: transform .16s ease, opacity .16s ease;
      transform: translateX(0) rotate(0deg);
    }

    #cardImage {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
      background: #fff;
    }

    .hint {
      color: #555;
      text-align: center;
      font-size: 14px;
      line-height: 1.35;
      white-space: normal;
    }

    .result {
      position: fixed;
      inset: 0;
      display: none;
      place-items: start center;
      z-index: 100;
      background: #f6f4ec;
      padding: 24px 22px;
      overflow: hidden;
    }
    .result.show { display: grid; }

    .result-card {
      width: min(60vw, 1200px);
      max-width: 60vw;
      height: calc(100vh - 48px);
      overflow: hidden;
      border-radius: 20px;
      border: 1px solid #e3e8eb;
      box-shadow: 0 10px 34px rgba(20, 28, 36, 0.08);
      padding: 20px 22px 18px;
      background: #fff;
      color: #1f2328;
    }

    .result-layout {
      display: grid;
      grid-template-columns: 384px 1fr;
      gap: 20px;
      align-items: start;
      height: 100%;
    }

    .result-left {
      display: grid;
      place-items: start;
    }

    .result-frame {
      width: 384px;
      border-radius: 12px;
      border: 2px solid #dde4e8;
      background: #fff;
      padding: 8px;
    }

    .result-icon {
      width: 100%;
      max-width: 360px;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: contain;
      margin: 0 auto;
      display: block;
    }

    .type-code {
      font-size: clamp(50px, 5.8vw, 80px);
      line-height: 1.02;
      margin: 2px 0 6px;
      text-align: left;
    }

    .type-main-title {
      font-size: clamp(32px, 3vw, 44px);
      line-height: 1.12;
      margin: 0 0 10px;
      text-align: left;
    }

    .result-pill {
      display: inline-block;
      border-radius: 14px;
      background: #ecfffa;
      color: #046c69;
      font-size: 20px;
      line-height: 1.2;
      padding: 10px 14px;
      margin: 8px 0 14px;
    }

    .type-slogan {
      margin: 12px 0 8px;
      font-size: 32px;
      line-height: 1.35;
      color: #21344f;
      white-space: pre-line;
      text-align: left;
    }

    .type-subline {
      margin: 6px 0 10px;
      font-size: 24px;
      line-height: 1.45;
      color: #2c3f59;
      white-space: pre-line;
      text-align: left;
    }

    .type-quickread {
      margin: 8px 0;
      font-size: 20px;
      line-height: 1.55;
      color: #21344f;
      white-space: pre-line;
      text-align: left;
    }

    .type-all-fields {
      margin-top: 16px;
      text-align: left;
      border-top: 1px solid #e6ebef;
      padding-top: 12px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 16px;
      align-content: start;
      min-height: 0;
      overflow: hidden;
    }

    .field-item {
      margin: 0;
      font-size: 15px;
      line-height: 1.45;
      color: #2b3441;
      white-space: pre-line;
      word-break: break-word;
      border: 1px solid #edf1f4;
      border-radius: 10px;
      padding: 8px 10px;
      background: #fbfdff;
    }

    .field-key {
      display: inline-block;
      background: #eef7ff;
      color: #476a8e;
      border-radius: 999px;
      padding: 2px 8px;
      margin-right: 6px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .result-actions {
      margin-top: 8px;
      display: flex;
      justify-content: flex-end;
    }

    @media (max-width: 980px) {
      .result-card { width: 94vw; max-width: 94vw; }
      .result-layout { grid-template-columns: 1fr; }
      .result-left { margin-bottom: 8px; }
      .result-frame { width: min(100%, 340px); }
      .type-all-fields { grid-template-columns: 1fr; }
      .type-code, .type-main-title { text-align: center; }
      .type-slogan, .type-subline, .type-quickread { text-align: center; }
      .result-actions { justify-content: center; }
    }
  </style>
</head>
<body>
  <button class="audio-toggle" id="musicToggle" aria-pressed="true" type="button">音乐 ON</button>

  <section class="menu" id="menu">
    <div class="menu-card">
      <img class="menu-bg-image" src="./assets/openpage.png" alt="开场页" />
      <button id="startBtn" class="menu-start" type="button">开始裁决</button>
    </div>
  </section>

  <main class="game" id="game" hidden>
    <div class="stage">
      <div class="choice-bars">
        <div class="side-choice side-left" id="leftChoice"></div>
        <div class="side-choice side-right" id="rightChoice"></div>
      </div>

      <div class="panel">
        <header class="top-bar">
          <div class="top-icons" id="topIcons"></div>
        </header>

        <section class="board">
          <div class="story-text" id="body"></div>
          <div class="visual-wrap" id="visualDrag">
            <img id="cardImage" src="./assets/card/card_1.png" alt="card" />
          </div>
          <div class="hint">使用鼠标向左/右拖动图片选择<br>键盘方向键←/→亦可选择</div>
        </section>

        <footer class="bottom-bar" id="lastChoice">伦理审核报告生成中<br>ID：6202668？</footer>
      </div>
    </div>
  </main>

  <section class="result" id="result">
    <div class="result-card">
      <div class="result-layout">
        <aside class="result-left">
          <div class="result-frame">
            <img class="result-icon" id="resultIcon" src="./assets/icon_type/icon_type_QSNR.png" alt="result" />
          </div>
        </aside>
        <section class="result-right">
          <div class="type-code" id="resultCode">----</div>
          <div class="type-main-title" id="typeNameCn"></div>
          <div class="type-slogan" id="typeSlogan"></div>
          <div class="result-pill" id="resultPill"></div>
          <div class="type-subline" id="typeSubline"></div>
          <div class="type-quickread" id="typeQuickread"></div>
          <div class="type-all-fields" id="typeAllFields"></div>
        </section>
      </div>
      <div class="result-actions">
        <button id="restartBtn">再来一次</button>
      </div>
    </div>
  </section>

  <script>
    const CONFIG_URLS = [
      "shinigami_story_config.json",
      "submissions/shinigami/config/shinigami_story_config.json"
    ];
    const IMAGE_CONFIG_URLS = [
      "submissions/shinigami/config/shinigami_story_config.json"
    ];
    const TYPE_CONFIG_URLS = [
      "submissions/shinigami/config/shinigami_16types_config.csv",
      "submissions/shinigami/config/shinigami_16types_config",
      "shinigami_16types_config.csv"
    ];
    const BGM_TRACKS_CSV_URLS = [
      "submissions/austin/audio-placeholder-v01/assets/audio/bgm_config/bgm_tracks.csv",
      "bgm_tracks.csv"
    ];
    const BGM_ANCHORS_CSV_URLS = [
      "submissions/austin/audio-placeholder-v01/assets/audio/bgm_config/bgm_anchors.csv",
      "bgm_anchors.csv"
    ];
    const BGM_TRANSITIONS_CSV_URLS = [
      "submissions/austin/audio-placeholder-v01/assets/audio/bgm_config/bgm_transitions.csv",
      "bgm_transitions.csv"
    ];

    const AXIS_KEYS = ["QI", "SP", "FN", "RB"];
    const AXES = {
      QI: { score: 0 }, SP: { score: 0 }, FN: { score: 0 }, RB: { score: 0 }
    };

    const SWIPE_THRESHOLD = 140;
    const IMG_EXTS = [".png", ".jpg", ".jpeg", ".jfif", ".webp"];
    const ICON_BASES = ["./assets/4icon/icon_1","./assets/4icon/icon_2","./assets/4icon/icon_3","./assets/4icon/icon_4"];
    const CARD_IMAGE_FALLBACK = "./assets/card/card_1.png";
    const RESULT_ICON_BASE = "./assets/icon_type/icon_type_";
    const SCENE_BASE_BY_RANGE = { s1:"./assets/scene/scene_01", s2:"./assets/scene/scene_02", s3:"./assets/scene/scene_03", s4:"./assets/scene/scene_04" };
    const SFX = {
      cardMotion: [
        {
          url: "submissions/austin/audio-placeholder-v01/assets/audio/sfx/u_nharq4usid-swipe-255512.mp3",
          gain: 1
        },
        {
          url: "submissions/austin/audio-placeholder-v01/assets/audio/sfx/universfield-swoosh-026-454861.mp3",
          gain: 0.28
        }
      ],
      volume: 0.42,
      pitchJitter: 0.2
    };
    const BGM = {
      tracks: {},
      transitions: {},
      volume: 0.17,
      fadeMs: 1800,
      preFadeMs: 1500,
      anchorWaitMaxMs: 30000
    };

    const els = {
      menu: document.getElementById("menu"),
      startBtn: document.getElementById("startBtn"),
      musicToggle: document.getElementById("musicToggle"),
      game: document.getElementById("game"),
      topIcons: document.getElementById("topIcons"),
      visualDrag: document.getElementById("visualDrag"),
      body: document.getElementById("body"),
      cardImage: document.getElementById("cardImage"),
      leftChoice: document.getElementById("leftChoice"),
      rightChoice: document.getElementById("rightChoice"),
      lastChoice: document.getElementById("lastChoice"),
      result: document.getElementById("result"),
      resultIcon: document.getElementById("resultIcon"),
      resultCode: document.getElementById("resultCode"),
      typeNameCn: document.getElementById("typeNameCn"),
      resultPill: document.getElementById("resultPill"),
      typeSlogan: document.getElementById("typeSlogan"),
      typeSubline: document.getElementById("typeSubline"),
      typeQuickread: document.getElementById("typeQuickread"),
      typeAllFields: document.getElementById("typeAllFields"),
      restartBtn: document.getElementById("restartBtn")
    };

    let cards = [];
    let typeMap = {};
    let idx = 0;
    let dragging = false;
    let startX = 0;
    let offsetX = 0;
    let gameStarted = false;
    let currentBgm = null;
    let currentBgmKey = "";
    let pendingBgmKey = "";
    let musicEnabled = true;

    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
    const sfxPool = SFX.cardMotion.map((sfx) => {
      const audio = new Audio(sfx.url);
      audio.preload = "auto";
      audio.volume = clamp(SFX.volume * (sfx.gain || 1), 0, 1);
      return { audio };
    });
    const getTypeCode = () => (AXES.QI.score >= 0 ? "Q" : "I") + (AXES.SP.score >= 0 ? "S" : "P") + (AXES.FN.score >= 0 ? "F" : "N") + (AXES.RB.score >= 0 ? "R" : "B");
    const axisFillPercent = (score) => clamp(50 + (clamp(score, -60, 60) / 60) * 50, 0, 100);

    function updateIconMeters() {
      AXIS_KEYS.forEach((k, i) => {
        const el = document.getElementById(`meter${i}`);
        if (!el) return;
        el.style.setProperty("--fill", `${axisFillPercent(AXES[k].score)}%`);
      });
    }

    async function pickFirstImageUrl(candidates) {
      for (const url of candidates) {
        try { const r = await fetch(url, { method: "HEAD", cache: "no-store" }); if (r.ok) return url; } catch (_) {}
      }
      return "";
    }

    async function setImgByCandidates(imgEl, candidates, fallback = "") {
      const url = await pickFirstImageUrl(candidates);
      imgEl.src = url || fallback;
    }

    async function setImgByBase(imgEl, base, fallback = "") {
      return setImgByCandidates(imgEl, IMG_EXTS.map((ext) => base + ext), fallback);
    }

    async function setBgByBase(base) {
      const url = await pickFirstImageUrl(IMG_EXTS.map((ext) => base + ext));
      if (url) document.documentElement.style.setProperty("--bg-image", `url("${url}")`);
    }

    function cardNumericId(card, index) {
      const n = Number.parseInt(String(card?.id ?? (index + 1)), 10);
      return Number.isNaN(n) ? index + 1 : n;
    }

    function uniqueValues(values) {
      return [...new Set(values.filter(Boolean))];
    }

    function normalizeAssetPath(value) {
      const normalized = String(value || "").trim().replace(/\\/g, "/");
      if (!normalized) return "";
      if (normalized.startsWith("./") || normalized.startsWith("../") || normalized.startsWith("http")) return normalized;
      if (normalized.startsWith("assets/")) return `./${normalized}`;
      return normalized;
    }

    function cardImageCandidates(card, index) {
      const rawValues = [card?.imagePath, card?.imageName, card?.image];
      if (!rawValues.some((value) => String(value || "").trim())) {
        rawValues.push(`card_${cardNumericId(card, index)}`);
      }

      const candidates = [];
      rawValues.forEach((rawValue) => {
        const normalized = normalizeAssetPath(rawValue);
        if (!normalized) return;

        const fileName = normalized.split("/").pop();
        const hasExtension = /\.[a-z0-9]{2,5}$/i.test(fileName);

        if (hasExtension) {
          candidates.push(normalized);
          if (!normalized.includes("/assets/card/")) {
            candidates.push(`./assets/card/${fileName}`);
          }
          return;
        }

        IMG_EXTS.forEach((ext) => {
          candidates.push(`./assets/card/${fileName}${ext}`);
        });
      });

      return uniqueValues(candidates);
    }

    function sceneBaseById(card, index) {
      const id = cardNumericId(card, index);
      if (id <= 8) return SCENE_BASE_BY_RANGE.s1;
      if (id <= 16) return SCENE_BASE_BY_RANGE.s2;
      if (id <= 24) return SCENE_BASE_BY_RANGE.s3;
      return SCENE_BASE_BY_RANGE.s4;
    }

    function mergeCardsWithImageMapping(baseCards, imageCards) {
      const cardsList = Array.isArray(baseCards) ? baseCards : [];
      const imageList = Array.isArray(imageCards) ? imageCards : [];
      if (!imageList.length) return cardsList;

      const imageById = new Map(imageList.map((card) => [String(card?.id ?? ""), card]));
      return cardsList.map((card, i) => {
        const id = String(card?.id ?? "");
        const imageCard = imageById.get(id) || imageList[i] || null;
        if (!imageCard) return card;
        return {
          ...card,
          imageName: imageCard.imageName || card.imageName || null,
          imagePath: imageCard.imagePath || card.imagePath || null
        };
      });
    }

    async function renderTopIcons() {
      els.topIcons.innerHTML = ICON_BASES.map((_, i) =>
        `<div class="meter-icon" id="meter${i}"></div>`
      ).join("");

      for (let i = 0; i < ICON_BASES.length; i++) {
        const url = await pickFirstImageUrl(IMG_EXTS.map((ext) => ICON_BASES[i] + ext));
        const el = document.getElementById(`meter${i}`);
        if (el && url) {
          el.style.setProperty("--icon-mask", `url("${url}")`);
        }
      }

      updateIconMeters();
    }

    function parseCSV(text) {
      const src = String(text || "").replace(/^\uFEFF/, "");
      const rows = []; let row = []; let cell = ""; let quote = false;
      for (let i = 0; i < src.length; i++) {
        const ch = src[i], next = src[i + 1];
        if (quote) {
          if (ch === "\"" && next === "\"") { cell += "\""; i++; }
          else if (ch === "\"") quote = false;
          else cell += ch;
        } else {
          if (ch === "\"") quote = true;
          else if (ch === ",") { row.push(cell); cell = ""; }
          else if (ch === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
          else if (ch !== "\r") cell += ch;
        }
      }
      row.push(cell); if (row.length > 1 || row[0] !== "") rows.push(row);
      return rows;
    }

    const normKey = (v) => String(v || "").trim().toLowerCase().replace(/\s+/g, "_");
    function pickField(obj, keys, fallback = "") {
      const aliases = keys.map(normKey);
      for (const k of Object.keys(obj)) if (aliases.includes(normKey(k))) return obj[k];
      return fallback;
    }

    function buildTypeMap(csvText) {
      const rows = parseCSV(csvText); if (!rows.length) return {};
      const headers = rows[0].map((h) => String(h || "").trim()); const map = {};
      for (let i = 1; i < rows.length; i++) {
        const cols = rows[i]; if (!cols.length) continue;
        const rowObj = {}; headers.forEach((h, idx) => { rowObj[h] = String(cols[idx] ?? "").trim(); });
        const code = pickField(rowObj, ["type_code", "code", "type", "mbti"]).toUpperCase(); if (!code) continue;
        map[code] = {
          type_name_cn: pickField(rowObj, ["type_name_cn", "name_cn", "name", "title"]),
          slogan: pickField(rowObj, ["slogan"]),
          subline: pickField(rowObj, ["subline"]),
          quickread_body: pickField(rowObj, ["quickread_body", "quickread", "desc", "description"]),
          all_fields: rowObj,
          field_order: headers
        };
      }
      return map;
    }

    function rowsToObjects(csvText) {
      const rows = parseCSV(csvText);
      if (!rows.length) return [];
      const headers = rows[0].map((h) => String(h || "").trim());
      return rows.slice(1)
        .filter((cols) => cols && cols.some((v) => String(v || "").trim() !== ""))
        .map((cols) => {
          const obj = {};
          headers.forEach((h, i) => { obj[h] = String(cols[i] ?? "").trim(); });
          return obj;
        });
    }

    function parseSeconds(value, fallback = 0) {
      const n = Number(value);
      return Number.isFinite(n) ? n : fallback;
    }

    function buildBgmConfigFromCsv(tracksCsv, anchorsCsv, transitionsCsv) {
      const tracks = {};

      rowsToObjects(tracksCsv).forEach((row) => {
        const key = pickField(row, ["track", "key", "id"]);
        const url = pickField(row, ["url", "path", "file"]);
        if (!key || !url) return;
        tracks[key] = { url, anchors: {} };
      });

      rowsToObjects(anchorsCsv).forEach((row) => {
        const trackKey = pickField(row, ["track", "trackKey", "key"]);
        const anchor = pickField(row, ["anchor", "anchorName", "name"]);
        if (!tracks[trackKey] || !anchor) return;
        tracks[trackKey].anchors[anchor] = {
          at: parseSeconds(pickField(row, ["time_sec", "time", "sec", "seconds"])),
          type: pickField(row, ["type", "section", "kind"], "default")
        };
      });

      const transitions = {};
      rowsToObjects(transitionsCsv).forEach((row) => {
        const fromTrack = pickField(row, ["from_track", "fromTrack", "from"]);
        const toTrack = pickField(row, ["to_track", "toTrack", "to"]);
        const target = pickField(row, ["target_anchor", "targetAnchor", "target"]);
        if (!fromTrack || !toTrack || !target) return;

        const ruleKey = `${fromTrack}->${toTrack}`;
        const fromAnchor = pickField(row, ["from_anchor", "fromAnchor", "anchor"]);
        const fromType = pickField(row, ["from_type", "fromType", "type"], "default");
        const bucket = fromAnchor || fromType || "default";

        transitions[ruleKey] ||= {};
        transitions[ruleKey][bucket] ||= [];
        transitions[ruleKey][bucket].push({
          target,
          silenceMs: parseSeconds(pickField(row, ["silence_ms", "silenceMs"], "0")),
          weight: Math.max(1, Math.round(parseSeconds(pickField(row, ["weight"], "1"), 1)))
        });
      });

      BGM.tracks = tracks;
      BGM.transitions = transitions;
    }

    async function fetchFirstText(candidates) {
      const errors = [];
      for (const url of candidates) {
        try { const r = await fetch(url, { cache: "no-store" }); if (r.ok) return await r.text(); errors.push(`${url}:${r.status}`); }
        catch (e) { errors.push(`${url}:${e.message}`); }
      }
      throw new Error(`文本加载失败：${errors.join(" | ")}`);
    }

    async function fetchFirstJSON(candidates) {
      const errors = [];
      for (const url of candidates) {
        try {
          const r = await fetch(url, { cache: "no-store" });
          if (r.ok) {
            const raw = await r.text();
            return parseLenientJSON(raw);
          }
          errors.push(`${url}:${r.status}`);
        }
        catch (e) { errors.push(`${url}:${e.message}`); }
      }
      throw new Error(`JSON 加载失败：${errors.join(" | ")}`);
    }

    function parseLenientJSON(raw) {
      let text = String(raw || "").replace(/^\uFEFF/, "");
      const lines = text.split(/\r?\n/).map((line) => {
        if (!/^\s*"[^"]+"\s*:\s*"/.test(line)) return line;
        const quoteCount = (line.match(/"/g) || []).length;
        if (quoteCount % 2 === 0) return line;
        const comma = line.lastIndexOf(",");
        if (comma >= 0) return `${line.slice(0, comma)}"${line.slice(comma)}`;
        return `${line}"`;
      });
      text = lines.join("\n").replace(/,\s*([}\]])/g, "$1");
      return JSON.parse(text);
    }

    function getTypeMeta(code) {
      return typeMap[code] || { type_name_cn: "未命名类型", slogan: "", subline: "", quickread_body: "" };
    }

    function prettyFieldLabel(key) {
      return String(key || "")
        .replace(/_/g, " ")
        .replace(/\b\w/g, (m) => m.toUpperCase());
    }

    function renderAllTypeFields(meta) {
      const root = els.typeAllFields;
      if (!root) return;
      const all = meta?.all_fields || {};
      const order = Array.isArray(meta?.field_order) ? meta.field_order : Object.keys(all);
      const hidden = new Set([
        "type_code", "code", "type", "mbti",
        "type_name_cn", "name_cn", "name", "title",
        "slogan", "subline",
        "quickread_body", "quickread", "desc", "description"
      ]);
      const lines = [];
      for (const k of order) {
        if (hidden.has(normKey(k))) continue;
        const val = String(all[k] ?? "").trim();
        if (!val) continue;
        lines.push(
          `<div class="field-item"><span class="field-key">${prettyFieldLabel(k)}:</span><span>${val}</span></div>`
        );
      }
      root.innerHTML = lines.join("");
    }

    function buildResultPill(meta) {
      const all = meta?.all_fields || {};
      const find = (keys) => {
        for (const k of Object.keys(all)) {
          if (keys.includes(normKey(k))) return String(all[k] || "").trim();
        }
        return "";
      };
      const match = find(["match_rate", "match", "score", "rate", "匹配度"]);
      const hit = find(["hit", "precision", "dimension_hit", "命中", "精准命中"]);
      if (match && hit) return `匹配度 ${match} · 精准命中 ${hit}`;
      if (match) return `匹配度 ${match}`;
      if (hit) return `精准命中 ${hit}`;
      return "";
    }

    function playCardSfx() {
      if (!sfxPool.length) return;
      const { audio } = sfxPool[Math.floor(Math.random() * sfxPool.length)];
      audio.pause();
      audio.currentTime = 0;
      audio.playbackRate = 1 + (Math.random() * 2 - 1) * SFX.pitchJitter;
      audio.play().catch(() => {});
    }

    function unlockSfx() {
      sfxPool.forEach(({ audio }) => audio.load());
    }

    function fadeAudio(audio, from, to, durationMs, onDone) {
      const startedAt = performance.now();
      const safeDuration = Math.max(1, durationMs);
      audio.volume = clamp(from, 0, 1);
      const timer = setInterval(() => {
        const t = clamp((performance.now() - startedAt) / safeDuration, 0, 1);
        audio.volume = clamp(from + (to - from) * t, 0, 1);
        if (t >= 1) {
          clearInterval(timer);
          if (onDone) onDone();
        }
      }, 40);
    }

    function sortedAnchors(track) {
      return Object.entries(track?.anchors || {})
        .map(([name, anchor]) => ({ name, ...anchor }))
        .sort((a, b) => a.at - b.at);
    }

    function currentAnchorForTrack(key) {
      const track = BGM.tracks[key];
      if (!track || !currentBgm) return null;
      return sortedAnchors(track).reduce((current, anchor) => {
        return anchor.at <= currentBgm.currentTime ? anchor : current;
      }, null);
    }

    function nextAnchorForTrack(key) {
      const track = BGM.tracks[key];
      if (!track || !currentBgm) return null;
      return sortedAnchors(track).find((anchor) => anchor.at > currentBgm.currentTime) || null;
    }

    function chooseTransition(fromKey, toKey) {
      const fromAnchor = currentAnchorForTrack(fromKey);
      const fromType = fromAnchor?.type || "default";
      const rule = BGM.transitions[`${fromKey}->${toKey}`] || {};
      const options = rule[fromAnchor?.name] || rule[fromType] || rule.default || [{ target: "intro1" }];
      const weighted = options.flatMap((option) => Array(option.weight || 1).fill(option));
      return weighted[Math.floor(Math.random() * weighted.length)] || options[0];
    }

    function bgmEntryTime(key, anchorName) {
      const targetTrack = BGM.tracks[key];
      if (!targetTrack) return 0;
      return targetTrack.anchors?.[anchorName]?.at || 0;
    }

    function msUntilNextMusicalAnchor(key) {
      const nextAnchor = nextAnchorForTrack(key);
      if (!nextAnchor) return 0;
      const waitMs = (nextAnchor.at - currentBgm.currentTime) * 1000 - BGM.preFadeMs;
      return Math.min(Math.max(waitMs, 0), BGM.anchorWaitMaxMs);
    }

    function switchBgm(key, fadeMs = BGM.fadeMs, waitForAnchor = true, lockedTransition = null) {
      const track = BGM.tracks[key];
      if (!track) return;
      if (!musicEnabled) {
        currentBgmKey = key;
        if (currentBgm) {
          currentBgm.pause();
          currentBgm.currentTime = 0;
          currentBgm = null;
        }
        return;
      }
      if (currentBgmKey === key) {
        if (currentBgm && currentBgm.paused) {
          currentBgm.play().then(() => {
            fadeAudio(currentBgm, currentBgm.volume, BGM.volume, fadeMs);
          }).catch(() => {});
        }
        return;
      }

      const previousKey = currentBgmKey;
      const transition = lockedTransition || chooseTransition(previousKey, key);
      const waitMs = waitForAnchor ? msUntilNextMusicalAnchor(previousKey) : 0;
      if (waitMs > 0) {
        pendingBgmKey = key;
        setTimeout(() => {
          if (pendingBgmKey === key) switchBgm(key, fadeMs, false, transition);
        }, waitMs);
        return;
      }
      pendingBgmKey = "";
      currentBgmKey = key;

      const nextBgm = new Audio(track.url);
      nextBgm.loop = true;
      nextBgm.preload = "auto";
      nextBgm.volume = 0;
      nextBgm.currentTime = bgmEntryTime(key, transition.target);

      const previousBgm = currentBgm;
      currentBgm = nextBgm;

      const startNextBgm = () => nextBgm.play().then(() => {
        fadeAudio(nextBgm, 0, BGM.volume, fadeMs);
      }).catch(() => {});

      if (transition.silenceMs) {
        setTimeout(startNextBgm, transition.silenceMs);
      } else {
        startNextBgm();
      }

      if (previousBgm) {
        const previousVolume = previousBgm.volume;
        fadeAudio(previousBgm, previousVolume, 0, fadeMs, () => {
          previousBgm.pause();
          previousBgm.currentTime = 0;
        });
      }
    }

    function chapterBgmForIndex(cardIndex) {
      if (!cards.length) return "first";
      if (cardIndex >= 23) return "twoThirds";
      if (cardIndex >= 8) return "oneThird";
      return "first";
    }

    function updateChapterBgm() {
      switchBgm(chapterBgmForIndex(idx));
    }

    function setMusicEnabled(enabled) {
      musicEnabled = enabled;
      els.musicToggle.setAttribute("aria-pressed", String(enabled));
      els.musicToggle.textContent = enabled ? "音乐 ON" : "音乐 OFF";

      if (!enabled) {
        pendingBgmKey = "";
        if (currentBgm) {
          fadeAudio(currentBgm, currentBgm.volume, 0, 250, () => {
            currentBgm.pause();
          });
        }
        return;
      }

      currentBgmKey = "";
      switchBgm(gameStarted ? chapterBgmForIndex(idx) : "menu", 500, false);
    }

    function toggleMusic() {
      setMusicEnabled(!musicEnabled);
    }

    function startGame() {
      gameStarted = true;
      unlockSfx();
      els.menu.hidden = true;
      els.game.hidden = false;
      switchBgm(chapterBgmForIndex(idx), BGM.fadeMs, false);
      playCardSfx();
    }

    async function renderCard() {
      if (idx >= cards.length) return finishGame();
      if (gameStarted) {
        updateChapterBgm();
        playCardSfx();
      }
      const card = cards[idx], left = card.left || {}, right = card.right || {};
      els.body.textContent = card.text || "";
      els.leftChoice.textContent = left.label || "鍚戝乏";
      els.rightChoice.textContent = right.label || "鍚戝彸";

      els.leftChoice.style.opacity = "1";
      els.rightChoice.style.opacity = "1";
      els.leftChoice.style.transform = "translateY(-50%) translateX(0px)";
      els.rightChoice.style.transform = "translateY(-50%) translateX(0px)";

      els.visualDrag.style.opacity = "1";
      els.visualDrag.style.transform = "translateX(0px) rotate(0deg)";

      await Promise.all([
        setImgByCandidates(els.cardImage, cardImageCandidates(card, idx), CARD_IMAGE_FALLBACK),
        setBgByBase(sceneBaseById(card, idx))
      ]);
    }

    function applyEffects(effects = {}) {
      AXIS_KEYS.forEach((k) => { AXES[k].score += Number(effects[k] || 0); });
      updateIconMeters();
    }

    function choose(side) {
      const card = cards[idx]; if (!card) return;
      playCardSfx();
      const choice = side === "left" ? (card.left || {}) : (card.right || {});
      applyEffects(choice.effects || {});

      const dir = side === "left" ? -1 : 1;
      els.visualDrag.style.transform = `translateX(${dir * (window.innerWidth * 0.45)}px) rotate(${dir * 14}deg)`;
      els.visualDrag.style.opacity = "0";

      setTimeout(async () => { idx++; await renderCard(); }, 150);
    }

    function onDragStart(x) {
      if (els.result.classList.contains("show")) return;
      dragging = true; startX = x; offsetX = 0;
      els.visualDrag.style.transition = "none";
    }

    function onDragMove(x) {
      if (!dragging) return;
      offsetX = x - startX;
      const bias = clamp(offsetX / SWIPE_THRESHOLD, -1, 1);
      els.visualDrag.style.transform = `translateX(${offsetX}px) rotate(${bias * 8}deg)`;

      const t = Math.abs(bias);
      const nearAlpha = 1;
      const farAlpha = 1 - t;
      const leftAlpha = bias < 0 ? nearAlpha : farAlpha;
      const rightAlpha = bias > 0 ? nearAlpha : farAlpha;
      els.leftChoice.style.opacity = `${leftAlpha}`;
      els.rightChoice.style.opacity = `${rightAlpha}`;

      const retreat = 86;
      els.leftChoice.style.transform = `translateY(-50%) translateX(${bias < 0 ? -Math.abs(bias) * retreat : 0}px)`;
      els.rightChoice.style.transform = `translateY(-50%) translateX(${bias > 0 ? Math.abs(bias) * retreat : 0}px)`;
    }

    function onDragEnd() {
      if (!dragging) return;
      dragging = false;
      els.visualDrag.style.transition = "transform .16s ease, opacity .16s ease";
      if (Math.abs(offsetX) >= SWIPE_THRESHOLD) return choose(offsetX < 0 ? "left" : "right");

      els.visualDrag.style.transform = "translateX(0px) rotate(0deg)";
      els.leftChoice.style.opacity = "1";
      els.rightChoice.style.opacity = "1";
      els.leftChoice.style.transform = "translateY(-50%) translateX(0px)";
      els.rightChoice.style.transform = "translateY(-50%) translateX(0px)";
    }

    async function finishGame() {
      const code = getTypeCode(), meta = getTypeMeta(code);
      await setImgByBase(els.resultIcon, RESULT_ICON_BASE + code, els.resultIcon.src);
      els.resultCode.textContent = code;
      els.typeNameCn.textContent = meta.type_name_cn || "未命名类型";
      const pill = buildResultPill(meta);
      els.resultPill.textContent = pill || "死神伦理审查结果已生成";
      els.resultPill.style.display = "inline-block";
      els.typeSlogan.textContent = meta.slogan || "";
      els.typeSubline.textContent = meta.subline || "";
      els.typeQuickread.textContent = meta.quickread_body || "";
      renderAllTypeFields(meta);
      els.result.classList.add("show");
    }

    async function resetGame() {
      AXIS_KEYS.forEach((k) => { AXES[k].score = 0; });
      updateIconMeters();
      idx = 0;
      els.result.classList.remove("show");
      await renderCard();
    }

    function bindEvents() {
      els.musicToggle.addEventListener("click", toggleMusic);
      els.menu.addEventListener("pointerdown", () => switchBgm("menu", BGM.fadeMs, false), { once: true });
      els.startBtn.addEventListener("click", startGame);
      els.restartBtn.addEventListener("click", resetGame);

      els.visualDrag.addEventListener("pointerdown", (e) => {
        els.visualDrag.setPointerCapture(e.pointerId);
        onDragStart(e.clientX);
      });
      els.visualDrag.addEventListener("pointermove", (e) => onDragMove(e.clientX));
      els.visualDrag.addEventListener("pointerup", onDragEnd);
      els.visualDrag.addEventListener("pointercancel", onDragEnd);

      window.addEventListener("keydown", (e) => {
        if (els.result.classList.contains("show")) return;
        if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") choose("left");
        if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") choose("right");
      });
    }

    async function init() {
      bindEvents();
      await renderTopIcons();
      await setBgByBase(SCENE_BASE_BY_RANGE.s1);

      try {
        const [storyConfig, typeCsv, bgmTracksCsv, bgmAnchorsCsv, bgmTransitionsCsv] = await Promise.all([
          fetchFirstJSON(CONFIG_URLS),
          fetchFirstText(TYPE_CONFIG_URLS),
          fetchFirstText(BGM_TRACKS_CSV_URLS),
          fetchFirstText(BGM_ANCHORS_CSV_URLS),
          fetchFirstText(BGM_TRANSITIONS_CSV_URLS)
        ]);
        let imageConfig = { cards: [] };
        try { imageConfig = await fetchFirstJSON(IMAGE_CONFIG_URLS); } catch (_) {}
        cards = mergeCardsWithImageMapping(storyConfig.cards, imageConfig.cards);
        typeMap = buildTypeMap(typeCsv);
        buildBgmConfigFromCsv(bgmTracksCsv, bgmAnchorsCsv, bgmTransitionsCsv);
        await resetGame();
      } catch (e) {
        els.body.textContent = e.message;
      }
    }

    init();
  </script>
</body>
</html>
