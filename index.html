<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>死神值班：电车裁决</title>
  <style>
    :root {
      --bg: #111318;
      --panel: #1b1f2a;
      --text: #f2f4f8;
      --muted: #aab1c3;
      --left: #2b8a3e;
      --right: #c92a2a;
      --accent: #ffd43b;
      --border: #2a3040;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 20%, #1c2130 0, var(--bg) 45%);
      color: var(--text);
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .app {
      width: min(860px, 100%);
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .board {
      position: relative;
      min-height: 420px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: linear-gradient(170deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
      overflow: hidden;
      padding: 24px;
    }

    .card {
      position: absolute;
      inset: 24px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--panel);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      cursor: grab;
      user-select: none;
      transition: transform 180ms ease, opacity 180ms ease;
      touch-action: none;
    }

    .card h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.35;
    }

    .card p {
      margin: 0;
      color: #d9deea;
      line-height: 1.6;
      font-size: 16px;
      white-space: pre-line;
    }

    .card-tag {
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .choice-hint {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .left-flag, .right-flag {
      position: absolute;
      top: 18px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 120ms ease;
      font-weight: 600;
    }

    .left-flag {
      left: 18px;
      background: rgba(43, 138, 62, 0.2);
      color: #8ce99a;
      border: 1px solid rgba(43, 138, 62, 0.35);
    }

    .right-flag {
      right: 18px;
      background: rgba(201, 42, 42, 0.18);
      color: #ffa8a8;
      border: 1px solid rgba(201, 42, 42, 0.35);
    }

    .show-left .left-flag,
    .show-right .right-flag { opacity: 1; }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      border: 1px solid var(--border);
      background: #161b25;
      color: var(--text);
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.06); }

    .axis {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      background: rgba(0,0,0,0.15);
      display: grid;
      gap: 10px;
    }

    .axis-row {
      display: grid;
      grid-template-columns: 122px 1fr 122px;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .bar {
      position: relative;
      height: 8px;
      border-radius: 999px;
      background: #111621;
      overflow: hidden;
    }

    .bar-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 0;
      transform: translateX(-50%);
      background: linear-gradient(90deg, #74c0fc, #ff8787);
      transition: width 200ms ease;
    }

    .result {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
      padding: 18px;
      display: none;
      gap: 10px;
    }

    .result.show { display: grid; }

    .result h3 {
      margin: 0;
      font-size: 26px;
    }

    .share {
      border: 1px solid var(--border);
      background: #111621;
      border-radius: 10px;
      padding: 10px;
      color: #d9deea;
      white-space: pre-line;
      font-size: 14px;
    }

    .muted { color: var(--muted); }

    @media (max-width: 700px) {
      .card { inset: 12px; }
      .axis-row { grid-template-columns: 92px 1fr 92px; font-size: 12px; }
      .card h2 { font-size: 20px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div id="progress">第 1 / 15 卡</div>
      <div>操作：← / A 选左，→ / D 选右，或拖拽卡片</div>
    </div>

    <section class="board" id="board">
      <article class="card" id="card">
        <div class="left-flag" id="leftFlag"></div>
        <div class="right-flag" id="rightFlag"></div>
        <div class="card-tag" id="tag"></div>
        <h2 id="title"></h2>
        <p id="body"></p>
        <div class="choice-hint">
          <span id="leftChoice"></span>
          <span id="rightChoice"></span>
        </div>
      </article>
    </section>

    <div class="controls">
      <button id="btnLeft"></button>
      <button id="btnRight"></button>
    </div>

    <section class="axis" id="axisBoard"></section>

    <section class="result" id="result">
      <div class="muted">人格结算</div>
      <h3 id="typeName"></h3>
      <div id="typeCode"></div>
      <p id="typeDesc"></p>
      <div class="share" id="shareText"></div>
      <div class="controls">
        <button id="copyBtn">复制分享文案</button>
        <button id="restartBtn">再值一次班</button>
      </div>
    </section>
  </main>

  <script>
    const axes = {
      QI: { left: "Q 数量主义", right: "I 个体主义", score: 0 },
      SP: { left: "S 自我圈层", right: "P 公共中立", score: 0 },
      FN: { left: "F 长期结果", right: "N 当下止损", score: 0 },
      RB: { left: "R 规则服从", right: "B 规则突破", score: 0 }
    };

    const cards = [
      {
        tag: "事件背景 01",
        title: "夜班刚开始，A-17 号列车刹车失灵",
        body: "主线有 5 名维修工。\n岔道上有 1 名轨道医生，正在抢修急救通道。\n你只负责裁决，不负责解释。",
        left: { label: "记录：继续收集信息", effects: { RB: +4 } },
        right: { label: "记录：立刻进入裁决流程", effects: { RB: -4 } }
      },
      {
        tag: "决策卡 02",
        title: "第一裁决：拨向哪条轨道？",
        body: "现在切轨能救一侧。另一侧会死。",
        left: { label: "拨向岔道（死 1，救 5）", effects: { QI: +12, FN: +8, RB: -4 } },
        right: { label: "维持主线（死 5，保 1）", effects: { QI: -12, FN: -8, RB: +4 } }
      },
      {
        tag: "求情卡 03",
        title: "岔道医生发来语音",
        body: "“今晚还有 4 台大手术排队。我死了，明天会多死很多人。”",
        left: { label: "采信医生的未来价值", effects: { FN: +12, QI: +8 } },
        right: { label: "拒绝用未来押注当下命", effects: { FN: -12, QI: -4 } }
      },
      {
        tag: "求情卡 04",
        title: "主线维修班长提交名单",
        body: "“5 个人里有我弟弟。还有 2 个实习生，家里全靠他们。”",
        left: { label: "身份关系应被考虑", effects: { SP: +12, QI: -4 } },
        right: { label: "关系不影响判决", effects: { SP: -12, RB: +4 } }
      },
      {
        tag: "决策卡 05",
        title: "执行前二次确认",
        body: "系统提示：可按《紧急调度条例》走程序，或手动覆盖。",
        left: { label: "按流程走（即使更慢）", effects: { RB: +12, FN: -4 } },
        right: { label: "手动覆盖先救命", effects: { RB: -12, FN: +4 } }
      },
      {
        tag: "事件反馈 06",
        title: "列车停下了，但事故舆论炸裂",
        body: "社媒把你称为“冷血分母党”或“道德绑架者”。\n上级要求你继续值班，下一辆已经进隧道。",
        left: { label: "接受标签，继续执行", effects: { RB: +4 } },
        right: { label: "拒绝标签，按直觉来", effects: { RB: -4 } }
      },
      {
        tag: "事件背景 07",
        title: "B-04 号车：主线是退休老兵 3 人，岔道是少年犯 1 人",
        body: "少年犯正在改造期，老兵是城市勋章获得者。",
        left: { label: "社会贡献应计入", effects: { FN: +8, SP: +4 } },
        right: { label: "身份历史不应折价生命", effects: { SP: -8, RB: +4 } }
      },
      {
        tag: "决策卡 08",
        title: "第二裁决：你会让谁死？",
        body: "你只能保一边。",
        left: { label: "保 3 名老兵，弃 1 人", effects: { QI: +8, SP: +8 } },
        right: { label: "保 1 名少年犯，弃 3 人", effects: { QI: -8, SP: -8 } }
      },
      {
        tag: "求情卡 09",
        title: "少年犯请求",
        body: "“我欠社会很多，但我刚签了骨髓捐献，明天配型成功就能救人。”",
        left: { label: "相信可逆转的未来", effects: { FN: +12, QI: -4 } },
        right: { label: "不拿可能性做筹码", effects: { FN: -12, RB: +4 } }
      },
      {
        tag: "求情卡 10",
        title: "老兵家属请求",
        body: "“他们守过城，现在该城市守他们。”",
        left: { label: "优先回报既有牺牲者", effects: { SP: +12, RB: +4 } },
        right: { label: "功勋不改变裁决规则", effects: { SP: -12, RB: +4 } }
      },
      {
        tag: "决策卡 11",
        title: "你发现系统有漏洞",
        body: "按规则上报可在 20 分钟后修复。立刻越权可现在修，但留后门风险。",
        left: { label: "先上报，维持程序", effects: { RB: +12, FN: -8 } },
        right: { label: "先越权，事后补报告", effects: { RB: -12, FN: +8 } }
      },
      {
        tag: "事件反馈 12",
        title: "第三列进站：主线是 2 名科研人员，岔道是 2 名普通乘客",
        body: "人数持平，身份争议极大。你没有更多时间。",
        left: { label: "按社会效用做区分", effects: { QI: +4, FN: +8 } },
        right: { label: "按个体等价不做区分", effects: { QI: -4, SP: -8 } }
      },
      {
        tag: "求情卡 13",
        title: "普通乘客发来一句话",
        body: "“我们只是普通人，所以更容易被放弃吗？”",
        left: { label: "普通人的当下不能被牺牲", effects: { SP: -8, FN: -4 } },
        right: { label: "角色效用必须纳入衡量", effects: { SP: +8, FN: +4 } }
      },
      {
        tag: "求情卡 14",
        title: "科研人员发来一句话",
        body: "“我们在做抗灾材料，明年可能救下几万人。”",
        left: { label: "为未来押注一次", effects: { FN: +12, QI: +8 } },
        right: { label: "未来不该凌驾眼前生命", effects: { FN: -12, QI: -8 } }
      },
      {
        tag: "终局裁决 15",
        title: "值班结束前最后一次签字",
        body: "你必须给系统留下一条元规则：\n以后类似情况，优先遵守什么？",
        left: { label: "优先规则与可追责性", effects: { RB: +12, SP: -4 } },
        right: { label: "优先结果与可挽回性", effects: { RB: -12, FN: +8 } }
      }
    ];

    const archetypes = {
      "A1": {
        name: "秩序工程师",
        desc: "你倾向把生命决策纳入可审计系统：先求整体可复制，再求局部最优。"
      },
      "A2": {
        name: "铁律守夜人",
        desc: "你更信任程序正义，宁可承受短期痛感，也不愿让裁决沦为个人直觉。"
      },
      "B1": {
        name: "破局功利家",
        desc: "你会主动打破流程，优先保住更多可延续的生命与社会功能。"
      },
      "B2": {
        name: "冷静止损者",
        desc: "你反对幻想式押注，更重视立刻可验证的损失控制。"
      },
      "C1": {
        name: "关系守护者",
        desc: "你承认责任与关系网的道德重量，裁决中会保留“自己人”维度。"
      },
      "C2": {
        name: "个体保全派",
        desc: "你抵触把人压成统计单位，愿意为“不可替代的一个人”承担代价。"
      },
      "D1": {
        name: "中立调停者",
        desc: "你追求一视同仁，不让身份、功勋或标签改变生命价值。"
      },
      "D2": {
        name: "逆流见证人",
        desc: "你常在多数意见外坚持异议，优先守住当下具体的人。"
      }
    };

    const els = {
      card: document.getElementById("card"),
      tag: document.getElementById("tag"),
      title: document.getElementById("title"),
      body: document.getElementById("body"),
      leftChoice: document.getElementById("leftChoice"),
      rightChoice: document.getElementById("rightChoice"),
      btnLeft: document.getElementById("btnLeft"),
      btnRight: document.getElementById("btnRight"),
      progress: document.getElementById("progress"),
      leftFlag: document.getElementById("leftFlag"),
      rightFlag: document.getElementById("rightFlag"),
      axisBoard: document.getElementById("axisBoard"),
      result: document.getElementById("result"),
      typeName: document.getElementById("typeName"),
      typeCode: document.getElementById("typeCode"),
      typeDesc: document.getElementById("typeDesc"),
      shareText: document.getElementById("shareText"),
      copyBtn: document.getElementById("copyBtn"),
      restartBtn: document.getElementById("restartBtn")
    };

    let idx = 0;
    let dragging = false;
    let startX = 0;
    let offsetX = 0;
    const SWIPE_THRESHOLD = 110;

    function clamp(v, min, max) {
      return Math.min(max, Math.max(min, v));
    }

    function applyEffects(effects) {
      Object.entries(effects).forEach(([k, delta]) => {
        if (axes[k]) axes[k].score += delta;
      });
    }

    function renderAxes() {
      const rows = Object.entries(axes).map(([k, axis]) => {
        const score = clamp(axis.score, -60, 60);
        const width = Math.abs(score) / 60 * 100;
        const strong = score >= 0 ? axis.left : axis.right;
        return `
          <div class="axis-row">
            <span>${axis.left}</span>
            <div class="bar"><div class="bar-fill" style="width:${width}%"></div></div>
            <span style="text-align:right">${axis.right}</span>
            <span class="muted" style="grid-column: 1 / 4;">${k}：${score >= 0 ? "偏" + axis.left : "偏" + axis.right}（${Math.abs(score)}）</span>
          </div>
        `;
      }).join("");
      els.axisBoard.innerHTML = rows;
    }

    function renderCard() {
      if (idx >= cards.length) {
        finishGame();
        return;
      }
      const card = cards[idx];
      els.tag.textContent = card.tag;
      els.title.textContent = card.title;
      els.body.textContent = card.body;
      els.leftChoice.textContent = "← " + card.left.label;
      els.rightChoice.textContent = card.right.label + " →";
      els.btnLeft.textContent = "左：" + card.left.label;
      els.btnRight.textContent = "右：" + card.right.label;
      els.leftFlag.textContent = "左：" + card.left.label;
      els.rightFlag.textContent = "右：" + card.right.label;
      els.progress.textContent = `第 ${idx + 1} / ${cards.length} 卡`;
      els.card.style.opacity = "1";
      els.card.style.transform = "translateX(0px) rotate(0deg)";
      els.card.classList.remove("show-left", "show-right");
    }

    function choose(side) {
      if (idx >= cards.length) return;
      const card = cards[idx];
      const choice = side === "left" ? card.left : card.right;
      applyEffects(choice.effects || {});

      const dir = side === "left" ? -1 : 1;
      els.card.style.transform = `translateX(${dir * 420}px) rotate(${dir * 12}deg)`;
      els.card.style.opacity = "0";

      setTimeout(() => {
        idx += 1;
        renderAxes();
        renderCard();
      }, 150);
    }

    function getTypeCode() {
      const q = axes.QI.score >= 0 ? "Q" : "I";
      const s = axes.SP.score >= 0 ? "S" : "P";
      const f = axes.FN.score >= 0 ? "F" : "N";
      const r = axes.RB.score >= 0 ? "R" : "B";
      return q + s + f + r;
    }

    function getArchetype() {
      const social = axes.QI.score + axes.SP.score;
      const method = axes.FN.score + axes.RB.score;
      const certainty = ["QI", "SP", "FN", "RB"].reduce((acc, key) => acc + Math.abs(axes[key].score), 0);

      let key = "A1";
      if (social >= 0 && method >= 0) key = certainty >= 120 ? "A1" : "A2";
      if (social >= 0 && method < 0) key = certainty >= 120 ? "B1" : "B2";
      if (social < 0 && method >= 0) key = certainty >= 120 ? "C1" : "C2";
      if (social < 0 && method < 0) key = certainty >= 120 ? "D1" : "D2";
      return archetypes[key];
    }

    function axisSummary() {
      const mapping = {
        QI: ["Q 数量主义", "I 个体主义"],
        SP: ["S 自我圈层", "P 公共中立"],
        FN: ["F 长期结果", "N 当下止损"],
        RB: ["R 规则服从", "B 规则突破"]
      };
      return Object.keys(mapping).map((k) => {
        const v = axes[k].score;
        const label = v >= 0 ? mapping[k][0] : mapping[k][1];
        return `${label} ${Math.abs(v)}`;
      }).join(" | ");
    }

    function finishGame() {
      els.card.style.display = "none";
      document.getElementById("board").style.display = "none";
      document.querySelector(".controls").style.display = "none";
      const code = getTypeCode();
      const type = getArchetype();
      els.result.classList.add("show");
      els.typeName.textContent = type.name;
      els.typeCode.textContent = `你的四轴代码：${code}`;
      els.typeDesc.textContent = type.desc;

      const share = [
        "【死神值班：电车裁决】",
        `我的结果：${type.name}（${code}）`,
        axisSummary(),
        "你会签下怎样的死亡裁决？"
      ].join("\n");
      els.shareText.textContent = share;
      els.progress.textContent = "值班结束";
    }

    function resetGame() {
      Object.keys(axes).forEach((k) => axes[k].score = 0);
      idx = 0;
      els.result.classList.remove("show");
      els.card.style.display = "flex";
      document.getElementById("board").style.display = "block";
      document.querySelector(".controls").style.display = "grid";
      renderAxes();
      renderCard();
    }

    function onDragStart(clientX) {
      dragging = true;
      startX = clientX;
      offsetX = 0;
      els.card.style.transition = "none";
    }

    function onDragMove(clientX) {
      if (!dragging) return;
      offsetX = clientX - startX;
      const rotate = clamp(offsetX / 18, -14, 14);
      els.card.style.transform = `translateX(${offsetX}px) rotate(${rotate}deg)`;

      els.card.classList.toggle("show-left", offsetX < -40);
      els.card.classList.toggle("show-right", offsetX > 40);
    }

    function onDragEnd() {
      if (!dragging) return;
      dragging = false;
      els.card.style.transition = "transform 160ms ease, opacity 160ms ease";
      if (offsetX <= -SWIPE_THRESHOLD) {
        choose("left");
        return;
      }
      if (offsetX >= SWIPE_THRESHOLD) {
        choose("right");
        return;
      }
      els.card.style.transform = "translateX(0) rotate(0deg)";
      els.card.classList.remove("show-left", "show-right");
    }

    els.btnLeft.addEventListener("click", () => choose("left"));
    els.btnRight.addEventListener("click", () => choose("right"));

    document.addEventListener("keydown", (e) => {
      if (idx >= cards.length) return;
      if (["ArrowLeft", "a", "A"].includes(e.key)) choose("left");
      if (["ArrowRight", "d", "D"].includes(e.key)) choose("right");
    });

    els.copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(els.shareText.textContent);
        els.copyBtn.textContent = "已复制";
      } catch {
        els.copyBtn.textContent = "复制失败，请手动复制";
      }
      setTimeout(() => els.copyBtn.textContent = "复制分享文案", 1200);
    });

    els.restartBtn.addEventListener("click", resetGame);

    els.card.addEventListener("pointerdown", (e) => {
      els.card.setPointerCapture(e.pointerId);
      onDragStart(e.clientX);
    });
    els.card.addEventListener("pointermove", (e) => onDragMove(e.clientX));
    els.card.addEventListener("pointerup", onDragEnd);
    els.card.addEventListener("pointercancel", onDragEnd);

    renderAxes();
    renderCard();
  </script>
</body>
</html>
