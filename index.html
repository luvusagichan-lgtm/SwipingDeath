<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>死神值班：电车裁决</title>
  <style>
    :root {
      --bg: #111318;
      --panel: #1b1f2a;
      --text: #f2f4f8;
      --muted: #aab1c3;
      --left: #2b8a3e;
      --right: #c92a2a;
      --accent: #ffd43b;
      --border: #2a3040;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 20%, #1c2130 0, var(--bg) 45%);
      color: var(--text);
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .app {
      width: min(860px, 100%);
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 14px;
    }

    .board {
      position: relative;
      min-height: 420px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: linear-gradient(170deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
      overflow: hidden;
      padding: 24px;
    }

    .card {
      position: absolute;
      inset: 24px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--panel);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      cursor: grab;
      user-select: none;
      transition: transform 180ms ease, opacity 180ms ease;
      touch-action: none;
    }

    .card h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.35;
    }

    .card p {
      margin: 0;
      color: #d9deea;
      line-height: 1.6;
      font-size: 16px;
      white-space: pre-line;
    }

    .card-tag {
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .choice-hint {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .left-flag, .right-flag {
      position: absolute;
      top: 18px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 120ms ease;
      font-weight: 600;
    }

    .left-flag {
      left: 18px;
      background: rgba(43, 138, 62, 0.2);
      color: #8ce99a;
      border: 1px solid rgba(43, 138, 62, 0.35);
    }

    .right-flag {
      right: 18px;
      background: rgba(201, 42, 42, 0.18);
      color: #ffa8a8;
      border: 1px solid rgba(201, 42, 42, 0.35);
    }

    .show-left .left-flag,
    .show-right .right-flag { opacity: 1; }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      border: 1px solid var(--border);
      background: #161b25;
      color: var(--text);
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.06); }

    .axis {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      background: rgba(0,0,0,0.15);
      display: grid;
      gap: 10px;
    }

    .axis-row {
      display: grid;
      grid-template-columns: 122px 1fr 122px;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .bar {
      position: relative;
      height: 8px;
      border-radius: 999px;
      background: #111621;
      overflow: hidden;
    }

    .bar-fill {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 0;
      transform: translateX(-50%);
      background: linear-gradient(90deg, #74c0fc, #ff8787);
      transition: width 200ms ease;
    }

    .result {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
      padding: 18px;
      display: none;
      gap: 10px;
    }

    .result.show { display: grid; }

    .result h3 {
      margin: 0;
      font-size: 26px;
    }

    .share {
      border: 1px solid var(--border);
      background: #111621;
      border-radius: 10px;
      padding: 10px;
      color: #d9deea;
      white-space: pre-line;
      font-size: 14px;
    }

    .muted { color: var(--muted); }

    @media (max-width: 700px) {
      .card { inset: 12px; }
      .axis-row { grid-template-columns: 92px 1fr 92px; font-size: 12px; }
      .card h2 { font-size: 20px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div id="progress">第 1 / 15 卡</div>
      <div>操作：← / A 选左，→ / D 选右，或拖拽卡片</div>
    </div>

    <section class="board" id="board">
      <article class="card" id="card">
        <div class="left-flag" id="leftFlag"></div>
        <div class="right-flag" id="rightFlag"></div>
        <div class="card-tag" id="tag"></div>
        <h2 id="title"></h2>
        <p id="body"></p>
        <div class="choice-hint">
          <span id="leftChoice"></span>
          <span id="rightChoice"></span>
        </div>
      </article>
    </section>

    <div class="controls">
      <button id="btnLeft"></button>
      <button id="btnRight"></button>
    </div>

    <section class="axis" id="axisBoard"></section>

    <section class="result" id="result">
      <div class="muted">人格结算</div>
      <h3 id="typeName"></h3>
      <div id="typeCode"></div>
      <p id="typeDesc"></p>
      <div class="share" id="shareText"></div>
      <div class="controls">
        <button id="copyBtn">复制分享文案</button>
        <button id="restartBtn">再值一次班</button>
      </div>
    </section>
  </main>

  <script>
    const CONFIG_URLS = {
      story: "submissions/shinigami/config/shinigami_story_config.json",
      types: "submissions/shinigami/config/shinigami_16types_config.json"
    };

    const SFX = {
      cardMotion: [
        "submissions/austin/audio-placeholder-v01/assets/audio/sfx/u_nharq4usid-swipe-255512.mp3",
        "submissions/austin/audio-placeholder-v01/assets/audio/sfx/universfield-swoosh-026-454861.mp3"
      ],
      volume: 0.42
    };

    const axes = {
      QI: { left: "Q 数量主义", right: "I 个体主义", score: 0 },
      SP: { left: "S 自我圈层", right: "P 公共中立", score: 0 },
      FN: { left: "F 长期结果", right: "N 当下止损", score: 0 },
      RB: { left: "R 规则服从", right: "B 规则突破", score: 0 }
    };

    const els = {
      card: document.getElementById("card"),
      tag: document.getElementById("tag"),
      title: document.getElementById("title"),
      body: document.getElementById("body"),
      leftChoice: document.getElementById("leftChoice"),
      rightChoice: document.getElementById("rightChoice"),
      btnLeft: document.getElementById("btnLeft"),
      btnRight: document.getElementById("btnRight"),
      progress: document.getElementById("progress"),
      leftFlag: document.getElementById("leftFlag"),
      rightFlag: document.getElementById("rightFlag"),
      axisBoard: document.getElementById("axisBoard"),
      result: document.getElementById("result"),
      typeName: document.getElementById("typeName"),
      typeCode: document.getElementById("typeCode"),
      typeDesc: document.getElementById("typeDesc"),
      shareText: document.getElementById("shareText"),
      copyBtn: document.getElementById("copyBtn"),
      restartBtn: document.getElementById("restartBtn")
    };

    let cards = [];
    let cardIndexById = {};
    let typeConfigs = {};
    let idx = 0;
    let dragging = false;
    let startX = 0;
    let offsetX = 0;
    const SWIPE_THRESHOLD = 110;
    const branchMergeRules = {
      "10-L": { group: "10", counterpart: "10-R", target: "12" },
      "10-R": { group: "10", counterpart: "10-L", target: "12" },
      "18-L": { group: "18", counterpart: "18-R", target: "20" },
      "18-R": { group: "18", counterpart: "18-L", target: "20" },
      "26-L": { group: "26", counterpart: "26-R", target: "28" },
      "26-R": { group: "26", counterpart: "26-L", target: "28" }
    };
    let branchVisitState = {};

    function clamp(v, min, max) {
      return Math.min(max, Math.max(min, v));
    }

    function playRandomSfx(urls = SFX.cardMotion) {
      if (!urls.length) return;
      const url = urls[Math.floor(Math.random() * urls.length)];
      const audio = new Audio(url);
      audio.volume = SFX.volume;
      audio.play().catch(() => {
        // Browsers block audio until the first user gesture; future card actions will unlock it.
      });
    }

    function resetBranchVisitState() {
      branchVisitState = Object.values(branchMergeRules).reduce((acc, rule) => {
        acc[rule.group] = { visited: new Set() };
        return acc;
      }, {});
    }

    function hasCardId(cardId) {
      return Object.prototype.hasOwnProperty.call(cardIndexById, String(cardId));
    }

    function resolveBranchMergeNext(card) {
      const rule = branchMergeRules[String(card.id)];
      if (!rule) {
        return null;
      }

      const state = branchVisitState[rule.group] || { visited: new Set() };
      state.visited.add(String(card.id));
      branchVisitState[rule.group] = state;

      if (!state.visited.has(rule.counterpart) && hasCardId(rule.counterpart)) {
        return rule.counterpart;
      }

      const mergeTarget = hasCardId(rule.target) ? rule.target : rule.fallbackTarget;
      if (mergeTarget && hasCardId(mergeTarget)) {
        state.visited.clear();
        return mergeTarget;
      }

      return null;
    }

    async function loadJson(url) {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`${url} 加载失败：${response.status}`);
      }
      return response.json();
    }

    async function loadConfigs() {
      els.progress.textContent = "正在读取配置...";
      const [storyConfig, typeConfig] = await Promise.all([
        loadJson(CONFIG_URLS.story),
        loadJson(CONFIG_URLS.types)
      ]);

      cards = Array.isArray(storyConfig.cards) ? storyConfig.cards : [];
      typeConfigs = typeConfig.types || {};
      cardIndexById = Object.fromEntries(cards.map((card, index) => [String(card.id), index]));

      if (!cards.length) {
        throw new Error("剧情配置里没有可用卡牌");
      }
      if (!Object.keys(typeConfigs).length) {
        throw new Error("人格配置里没有可用类型");
      }
    }

    function showConfigError(error) {
      els.tag.textContent = "配置读取失败";
      els.title.textContent = "无法加载玩法配置";
      els.body.textContent = [
        "请确认以下文件已经部署到 GitHub Pages：",
        CONFIG_URLS.story,
        CONFIG_URLS.types,
        "",
        error.message
      ].join("\n");
      els.leftChoice.textContent = "";
      els.rightChoice.textContent = "";
      els.btnLeft.textContent = "配置未加载";
      els.btnRight.textContent = "配置未加载";
      els.btnLeft.disabled = true;
      els.btnRight.disabled = true;
      els.progress.textContent = "配置错误";
    }

    function applyEffects(effects) {
      Object.entries(effects || {}).forEach(([k, delta]) => {
        if (axes[k]) axes[k].score += Number(delta) || 0;
      });
    }

    function renderAxes() {
      const rows = Object.entries(axes).map(([k, axis]) => {
        const score = clamp(axis.score, -60, 60);
        const width = Math.abs(score) / 60 * 100;
        return `
          <div class="axis-row">
            <span>${axis.left}</span>
            <div class="bar"><div class="bar-fill" style="width:${width}%"></div></div>
            <span style="text-align:right">${axis.right}</span>
            <span class="muted" style="grid-column: 1 / 4;">${k}：${score >= 0 ? "偏" + axis.left : "偏" + axis.right}（${Math.abs(score)}）</span>
          </div>
        `;
      }).join("");
      els.axisBoard.innerHTML = rows;
    }

    function renderCard() {
      if (idx >= cards.length) {
        finishGame();
        return;
      }
      const card = cards[idx];
      const left = card.left || {};
      const right = card.right || {};
      const displaySequence = card.sequence ?? idx + 1;
      els.tag.textContent = card.tag || `裁决 ${displaySequence}`;
      els.title.textContent = card.title || card.text || "未命名裁决";
      els.body.textContent = card.body || card.text || "";
      els.leftChoice.textContent = "← " + (left.label || "左选项");
      els.rightChoice.textContent = (right.label || "右选项") + " →";
      els.btnLeft.textContent = "左：" + (left.label || "左选项");
      els.btnRight.textContent = "右：" + (right.label || "右选项");
      els.leftFlag.textContent = "左：" + (left.label || "左选项");
      els.rightFlag.textContent = "右：" + (right.label || "右选项");
      els.progress.textContent = `第 ${displaySequence} / ${cards.length} 卡`;
      els.card.style.opacity = "1";
      els.card.style.transform = "translateX(0px) rotate(0deg)";
      els.card.classList.remove("show-left", "show-right");
      playRandomSfx();
    }

    function nextIndexFor(card, choice) {
      const branchNextId = resolveBranchMergeNext(card);
      if (branchNextId && hasCardId(branchNextId)) {
        return cardIndexById[String(branchNextId)];
      }

      const nextId = choice.next || card.autoNext;
      if (nextId && hasCardId(nextId)) {
        return cardIndexById[String(nextId)];
      }
      return idx + 1;
    }

    function choose(side) {
      if (idx >= cards.length) return;
      const card = cards[idx];
      const choice = side === "left" ? card.left || {} : card.right || {};
      playRandomSfx();
      applyEffects(choice.effects);

      const dir = side === "left" ? -1 : 1;
      els.card.style.transform = `translateX(${dir * 420}px) rotate(${dir * 12}deg)`;
      els.card.style.opacity = "0";

      setTimeout(() => {
        idx = nextIndexFor(card, choice);
        renderAxes();
        renderCard();
      }, 150);
    }

    function getTypeCode() {
      const q = axes.QI.score >= 0 ? "Q" : "I";
      const s = axes.SP.score >= 0 ? "S" : "P";
      const f = axes.FN.score >= 0 ? "F" : "N";
      const r = axes.RB.score >= 0 ? "R" : "B";
      return q + s + f + r;
    }

    function getTypeConfig(code) {
      return typeConfigs[code] || {
        name: "未命名人格",
        nameEn: code,
        headline: "你的人格类型是：",
        slogan: "",
        desc: "当前分值组合没有找到对应的人格配置。",
        shareText: `我测出${code}。`
      };
    }

    function axisSummary() {
      const mapping = {
        QI: ["Q 数量主义", "I 个体主义"],
        SP: ["S 自我圈层", "P 公共中立"],
        FN: ["F 长期结果", "N 当下止损"],
        RB: ["R 规则服从", "B 规则突破"]
      };
      return Object.keys(mapping).map((k) => {
        const v = axes[k].score;
        const label = v >= 0 ? mapping[k][0] : mapping[k][1];
        return `${label} ${Math.abs(v)}`;
      }).join(" | ");
    }

    function finishGame() {
      els.card.style.display = "none";
      document.getElementById("board").style.display = "none";
      document.querySelector(".controls").style.display = "none";
      const code = getTypeCode();
      const type = getTypeConfig(code);
      els.result.classList.add("show");
      els.typeName.textContent = type.name || code;
      els.typeCode.textContent = `${type.headline || "你的人格类型是："}${type.nameEn || code}（${code}）`;
      els.typeDesc.textContent = [type.slogan, type.subline, type.desc].filter(Boolean).join("\n\n");

      const share = [
        "【死神值班：电车裁决】",
        `我的结果：${type.name || code}（${type.nameEn || code}）`,
        type.shareText || "",
        axisSummary(),
        "你会签下怎样的死亡裁决？"
      ].filter(Boolean).join("\n");
      els.shareText.textContent = share;
      els.progress.textContent = "值班结束";
    }

    function resetGame() {
      Object.keys(axes).forEach((k) => axes[k].score = 0);
      idx = 0;
      resetBranchVisitState();
      els.result.classList.remove("show");
      els.card.style.display = "flex";
      document.getElementById("board").style.display = "block";
      document.querySelector(".controls").style.display = "grid";
      renderAxes();
      renderCard();
    }

    function onDragStart(clientX) {
      dragging = true;
      startX = clientX;
      offsetX = 0;
      els.card.style.transition = "none";
    }

    function onDragMove(clientX) {
      if (!dragging) return;
      offsetX = clientX - startX;
      const rotate = clamp(offsetX / 18, -14, 14);
      els.card.style.transform = `translateX(${offsetX}px) rotate(${rotate}deg)`;

      els.card.classList.toggle("show-left", offsetX < -40);
      els.card.classList.toggle("show-right", offsetX > 40);
    }

    function onDragEnd() {
      if (!dragging) return;
      dragging = false;
      els.card.style.transition = "transform 160ms ease, opacity 160ms ease";
      if (offsetX <= -SWIPE_THRESHOLD) {
        choose("left");
        return;
      }
      if (offsetX >= SWIPE_THRESHOLD) {
        choose("right");
        return;
      }
      els.card.style.transform = "translateX(0) rotate(0deg)";
      els.card.classList.remove("show-left", "show-right");
    }

    els.btnLeft.addEventListener("click", () => choose("left"));
    els.btnRight.addEventListener("click", () => choose("right"));

    document.addEventListener("keydown", (e) => {
      if (idx >= cards.length) return;
      if (["ArrowLeft", "a", "A"].includes(e.key)) choose("left");
      if (["ArrowRight", "d", "D"].includes(e.key)) choose("right");
    });

    els.copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(els.shareText.textContent);
        els.copyBtn.textContent = "已复制";
      } catch {
        els.copyBtn.textContent = "复制失败，请手动复制";
      }
      setTimeout(() => els.copyBtn.textContent = "复制分享文案", 1200);
    });

    els.restartBtn.addEventListener("click", resetGame);

    els.card.addEventListener("pointerdown", (e) => {
      els.card.setPointerCapture(e.pointerId);
      onDragStart(e.clientX);
    });
    els.card.addEventListener("pointermove", (e) => onDragMove(e.clientX));
    els.card.addEventListener("pointerup", onDragEnd);
    els.card.addEventListener("pointercancel", onDragEnd);

    async function init() {
      try {
        await loadConfigs();
        resetBranchVisitState();
        renderAxes();
        renderCard();
      } catch (error) {
        showConfigError(error);
      }
    }

    init();
  </script>
</body>
</html>
