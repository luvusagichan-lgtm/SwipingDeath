<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Death's Decree</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      color: #eef5ef;
      background: #08090d;
      display: grid;
      place-items: center;
      overflow: hidden;
      user-select: none;
    }
    .world-bg {
      position: fixed;
      inset: 0;
      background:
        linear-gradient(var(--world-sky, #15171d) 0 56%, var(--world-ground, #211d17) 56% 100%);
      transition: background .35s ease;
      overflow: hidden;
    }
    .world-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--world-scene);
      opacity: .96;
    }
    .world-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 24%, rgba(255,255,255,.08), transparent 28rem),
        linear-gradient(90deg, rgba(0,0,0,.44), transparent 24%, transparent 76%, rgba(0,0,0,.44)),
        rgba(0,0,0,.32);
    }
    .boot {
      position: fixed;
      inset: 0;
      z-index: 20;
      background: #000;
      display: grid;
      place-items: center;
      pointer-events: auto;
      opacity: 1;
      transition: opacity .34s ease;
    }
    .boot.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .boot-start {
      position: relative;
      z-index: 2;
      border: 1px solid rgba(142, 240, 215, .42);
      border-radius: 6px;
      padding: 14px 28px;
      color: #d8fff1;
      background: rgba(3, 24, 25, .78);
      font: inherit;
      font-size: 18px;
      letter-spacing: 0;
      box-shadow: 0 0 28px rgba(71, 218, 195, .20), inset 0 0 0 1px rgba(255,255,255,.06);
      cursor: pointer;
    }
    .boot-start:active {
      transform: translateY(1px);
    }
    .boot.playing .boot-start,
    .boot.hidden .boot-start {
      opacity: 0;
      pointer-events: none;
    }
    .boot::before,
    .boot::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0;
    }
    .boot.glitch::before {
      opacity: .42;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,.18) 0 1px, transparent 2px 7px),
        linear-gradient(90deg, rgba(255,0,80,.20), rgba(0,255,220,.16));
      animation: glitchSweep .18s steps(2) infinite;
    }
    .boot.glitch::after {
      opacity: .32;
      background: radial-gradient(circle at 50% 50%, transparent 0 28%, rgba(255,255,255,.18) 29%, transparent 31%);
      animation: glitchPulse .11s steps(2) infinite;
    }
    @keyframes glitchSweep {
      0% { transform: translateY(-3px) skewX(-2deg); }
      100% { transform: translateY(4px) skewX(2deg); }
    }
    @keyframes glitchPulse {
      0% { transform: translateX(-8px); }
      100% { transform: translateX(8px); }
    }
    .game {
      width: min(100vw, 1080px);
      height: min(100vh, 720px);
      height: min(100dvh, 720px);
      padding: 24px clamp(18px, 5vw, 56px);
      position: relative;
      z-index: 1;
    }
    .top {
      position: absolute;
      left: 50%;
      top: 10px;
      width: min(520px, calc(100vw - 36px));
      transform: translateX(-50%);
      display: grid;
      gap: 0;
      z-index: 4;
    }
    .header {
      display: none;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0;
    }
    .omen {
      color: #a9bcba;
      font-size: 17px;
      text-align: right;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      max-width: none;
      height: 78px;
      padding: 10px 74px;
      background:
        linear-gradient(180deg, rgba(7, 68, 63, .96), rgba(2, 28, 31, .96)),
        repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 1px, transparent 1px 18px);
      border: 1px solid rgba(178, 244, 222, .22);
      border-radius: 0 0 8px 8px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, .30), inset 0 1px 0 rgba(255,255,255,.12), inset 0 -10px 24px rgba(0,0,0,.28);
      transition: opacity .18s ease, transform .18s ease;
    }
    .game.no-stats .stats {
      opacity: 0;
      transform: translateY(-12px);
      pointer-events: none;
    }
    .stat {
      position: relative;
      width: 100%;
      height: 58px;
      background:
        radial-gradient(circle at 50% 18%, rgba(239,210,102,.18), transparent 44%),
        linear-gradient(180deg, rgba(12, 54, 54, .96), rgba(4, 19, 23, .98));
      border: 1px solid rgba(205, 242, 222, .22);
      border-radius: 7px;
      display: grid;
      place-items: center;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.42), inset 0 -8px 16px rgba(0,0,0,.32), 0 8px 18px rgba(0,0,0,.24);
    }
    .stat::before {
      content: "";
      position: absolute;
      inset: 7px;
      border-radius: 5px;
      border: 1px solid rgba(239, 210, 102, .16);
      box-shadow: 0 0 18px rgba(105, 225, 202, .08);
    }
    .stat::after {
      content: "";
      position: absolute;
      left: 12%;
      right: 12%;
      top: 8px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.34), transparent);
    }
    .stat-icon {
      width: 46px;
      height: 46px;
      display: block;
      overflow: visible;
      filter: drop-shadow(0 0 7px rgba(239, 210, 102, .24));
    }
    .axis-icon {
      width: 46px;
      height: 46px;
      display: block;
    }
    .axis-base {
      fill: none;
      stroke: rgba(224, 234, 219, .34);
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .axis-base .fill-shape {
      fill: rgba(224, 234, 219, .28);
      stroke: none;
    }
    .axis-fill {
      fill: none;
      stroke: var(--axis-fill);
      stroke-width: 3.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .axis-fill .fill-shape {
      fill: var(--axis-fill);
      stroke: none;
    }
    .hud-panel {
      position: absolute;
      z-index: 2;
      color: rgba(214, 248, 235, .78);
      border: 1px solid rgba(151, 232, 211, .18);
      background:
        linear-gradient(180deg, rgba(4, 34, 37, .62), rgba(4, 14, 18, .52)),
        repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 8px);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.04), 0 16px 34px rgba(0,0,0,.18);
      pointer-events: none;
    }
    .hud-panel.top-left {
      left: clamp(18px, 4vw, 54px);
      top: 26px;
      width: min(210px, 20vw);
      min-width: 150px;
      padding: 12px 14px;
      border-radius: 0 0 8px 0;
    }
    .hud-panel.top-right {
      right: clamp(18px, 4vw, 54px);
      top: 26px;
      width: min(210px, 20vw);
      min-width: 150px;
      padding: 12px 14px;
      border-radius: 0 0 0 8px;
      text-align: right;
    }
    .hud-kicker {
      font-size: 12px;
      color: rgba(239,210,102,.82);
      letter-spacing: 0;
    }
    .hud-value {
      margin-top: 5px;
      font-size: 18px;
      font-weight: 800;
      color: #e5fff5;
    }
    .hud-sub {
      margin-top: 4px;
      font-size: 12px;
      color: rgba(196, 225, 216, .62);
    }
    .lower-rig {
      position: absolute;
      left: clamp(20px, 7vw, 96px);
      right: clamp(20px, 7vw, 96px);
      bottom: 18px;
      height: 58px;
      z-index: 1;
      pointer-events: none;
      opacity: .82;
      background:
        linear-gradient(90deg, rgba(239,210,102,.40), transparent 16%, transparent 84%, rgba(239,126,114,.38)),
        repeating-linear-gradient(90deg, rgba(205, 242, 222, .20) 0 2px, transparent 2px 34px);
      border-top: 1px solid rgba(205, 242, 222, .18);
      border-bottom: 1px solid rgba(205, 242, 222, .08);
      mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
    }
    .lower-rig::before,
    .lower-rig::after {
      content: "";
      position: absolute;
      top: 13px;
      width: 120px;
      height: 28px;
      border: 1px solid rgba(239,210,102,.28);
      background: rgba(2, 18, 21, .42);
    }
    .lower-rig::before { left: 6%; }
    .lower-rig::after { right: 6%; }
    .card-plate {
      position: absolute;
      left: 50%;
      top: calc(50% + 26px);
      width: min(520px, calc(100vw - 36px));
      height: min(560px, calc(100vh - 136px));
      height: min(560px, calc(100dvh - 136px));
      min-height: 420px;
      transform: translate(-50%, -50%) scale(.985);
      z-index: 1;
      pointer-events: none;
      border-radius: 10px;
      border: 2px solid rgba(136, 102, 62, .54);
      background:
        linear-gradient(135deg, rgba(255,255,255,.10), transparent 18%),
        repeating-linear-gradient(0deg, rgba(69, 50, 35, .26) 0 1px, transparent 1px 18px),
        linear-gradient(180deg, #7a6447, #33271d);
      box-shadow: inset 0 0 0 6px rgba(23,18,13,.34), inset 0 20px 42px rgba(255,255,255,.08), 0 30px 70px rgba(0,0,0,.42);
    }
    .card-plate::before,
    .card-plate::after {
      content: "";
      position: absolute;
      inset: 18px;
      border: 1px solid rgba(239, 210, 102, .18);
      border-radius: 7px;
    }
    .card-plate::after {
      inset: auto 34px 24px;
      height: 8px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(239,210,102,.30), transparent);
    }
    .card {
      position: absolute;
      left: 50%;
      top: calc(50% + 18px);
      width: min(520px, calc(100vw - 36px));
      height: min(560px, calc(100vh - 136px));
      height: min(560px, calc(100dvh - 136px));
      min-height: 420px;
      transform: translate(-50%, -50%);
      background:
        linear-gradient(180deg, rgba(255,255,255,.16), transparent 18%),
        #dbd5be;
      color: #201913;
      border: 3px solid #35291f;
      border-radius: 8px;
      padding: 24px 26px;
      box-shadow: 0 26px 70px rgba(0, 0, 0, .45);
      display: grid;
      grid-template-rows: minmax(96px, auto) minmax(0, 1fr) auto;
      gap: 14px;
      cursor: grab;
      touch-action: none;
      transition: transform .18s ease, opacity .18s ease;
      z-index: 3;
      transform-origin: 50% 86%;
      will-change: transform, opacity;
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 9px;
      border: 1px solid rgba(53, 41, 31, .14);
      border-radius: 5px;
      pointer-events: none;
    }
    .card > * {
      position: relative;
      z-index: 1;
    }
    .game.no-stats .card {
      top: 50%;
    }
    .game.no-stats .card-plate {
      top: calc(50% + 8px);
    }
    .card:active { cursor: grabbing; }
    .card.peek-left {
      border-color: #284b74;
      box-shadow: 0 30px 76px rgba(20, 42, 72, .52);
    }
    .card.peek-right {
      border-color: #8a2e24;
      box-shadow: 0 30px 76px rgba(92, 28, 20, .50);
    }
    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      background: var(--portrait-bg, #dce45d);
      border-radius: 8px;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
      display: grid;
      place-items: end center;
    }
    .scene::before {
      display: none;
    }
    .scene.card-offer,
    .scene.card-mentor,
    .scene.card-people,
    .scene.card-network,
    .scene.card-flow,
    .scene.card-blade {
      place-items: center;
    }
    .scene.card-offer .person,
    .scene.card-people .person,
    .scene.card-network .person,
    .scene.card-flow .person,
    .scene.card-blade .person {
      display: none;
    }
    .feature.none {
      display: none;
    }
    .scene.card-offer::after {
      content: "";
      width: 178px;
      height: 122px;
      border-radius: 8px;
      background:
        linear-gradient(90deg, transparent 0 16px, rgba(17,55,54,.18) 17px 19px, transparent 20px),
        linear-gradient(0deg, transparent 0 30px, rgba(17,55,54,.20) 31px 33px, transparent 34px 55px, rgba(17,55,54,.16) 56px 58px, transparent 59px),
        #f0ead9;
      border: 3px solid #173736;
      box-shadow: 0 12px 0 rgba(0,0,0,.12), inset 0 0 0 9px rgba(4,75,67,.12);
    }
    .scene.card-offer::before {
      content: "OFFER";
      display: grid;
      place-items: center;
      position: absolute;
      width: 86px;
      height: 30px;
      transform: rotate(-8deg);
      border: 3px solid #c94f4a;
      color: #c94f4a;
      font-weight: 900;
      letter-spacing: 2px;
      opacity: .92;
      z-index: 1;
    }
    .scene.card-people::before {
      content: "";
      display: block;
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 27% 38%, #153937 0 13px, transparent 14px),
        radial-gradient(circle at 17% 60%, #153937 0 13px, transparent 14px),
        radial-gradient(circle at 37% 60%, #153937 0 13px, transparent 14px),
        radial-gradient(circle at 76% 50%, #762f34 0 17px, transparent 18px),
        linear-gradient(90deg, transparent 0 49%, rgba(21,57,55,.35) 49.5% 50.5%, transparent 51%);
    }
    .scene.card-people::after {
      content: "VS";
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #f0ead9;
      color: #173736;
      border: 3px solid #173736;
      font-weight: 900;
      z-index: 1;
    }
    .scene.card-network::before {
      content: "";
      display: block;
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 28% 34%, #153937 0 12px, transparent 13px),
        radial-gradient(circle at 18% 58%, #153937 0 12px, transparent 13px),
        radial-gradient(circle at 38% 61%, #153937 0 12px, transparent 13px),
        radial-gradient(circle at 70% 35%, #762f34 0 9px, transparent 10px),
        radial-gradient(circle at 82% 49%, #762f34 0 9px, transparent 10px),
        radial-gradient(circle at 68% 65%, #762f34 0 9px, transparent 10px),
        radial-gradient(circle at 86% 70%, #762f34 0 9px, transparent 10px);
    }
    .scene.card-network::after {
      content: "";
      position: absolute;
      left: 18%;
      top: 33%;
      width: 28%;
      height: 30%;
      border-left: 3px solid #153937;
      border-top: 3px solid #153937;
      border-bottom: 3px solid #153937;
      transform: skewX(-12deg);
      opacity: .8;
    }
    .scene.card-flow::before {
      content: "";
      display: block;
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, transparent 0 22%, #153937 22.5% 23.5%, transparent 24% 49%, #153937 49.5% 50.5%, transparent 51% 76%, #153937 76.5% 77.5%, transparent 78%),
        radial-gradient(circle at 23% 50%, #f0ead9 0 22px, #153937 23px 25px, transparent 26px),
        radial-gradient(circle at 50% 50%, #f0ead9 0 22px, #153937 23px 25px, transparent 26px),
        radial-gradient(circle at 77% 50%, #f0ead9 0 22px, #153937 23px 25px, transparent 26px);
    }
    .scene.card-flow::after {
      content: "越权";
      display: grid;
      place-items: center;
      width: 112px;
      height: 56px;
      transform: rotate(-12deg);
      border: 5px solid #c94f4a;
      color: #c94f4a;
      font-size: 28px;
      font-weight: 900;
      z-index: 1;
    }
    .scene.card-blade::before {
      content: "";
      display: block;
      width: 32px;
      height: 190px;
      background: linear-gradient(90deg, #d6fff2, #f0ead9 46%, #68d8d6 52%, #173736);
      clip-path: polygon(44% 0, 72% 0, 58% 76%, 100% 100%, 0 100%, 42% 76%);
      filter: drop-shadow(0 0 18px rgba(104,216,214,.55));
    }
    .scene.card-blade::after {
      content: "";
      position: absolute;
      width: 160px;
      height: 18px;
      border-radius: 999px;
      background: #173736;
      bottom: 48px;
    }
    .person {
      position: relative;
      left: auto;
      bottom: auto;
      width: 190px;
      height: 190px;
      transform: translateX(var(--char-nudge, 0));
      transform-origin: 50% 100%;
    }
    .person::before {
      content: "";
      position: absolute;
      left: 50px;
      top: 8px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #b69b7b;
      box-shadow: inset 0 -10px 0 rgba(64, 43, 32, .18);
    }
    .person::after {
      content: "";
      position: absolute;
      left: 10px;
      top: 78px;
      width: 170px;
      height: 120px;
      background: var(--robe, #16181f);
      clip-path: polygon(50% 0, 88% 24%, 100% 100%, 0 100%, 12% 24%);
      border-bottom: 8px solid rgba(255,255,255,.12);
    }
    .feature {
      position: absolute;
      left: 50%;
      top: 0;
      width: 170px;
      height: 160px;
      transform: translateX(-50%);
      z-index: 2;
    }
    .eyes {
      position: absolute;
      left: 50%;
      top: 54px;
      width: 58px;
      transform: translateX(-50%);
      display: flex;
      justify-content: space-between;
      z-index: 3;
    }
    .eyes i {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #1a1510;
    }
    .feature.crown {
      left: 50%;
      top: -6px;
      background: linear-gradient(135deg, transparent 30%, #f1cf55 31% 45%, transparent 46%),
        linear-gradient(225deg, transparent 30%, #f1cf55 31% 45%, transparent 46%),
        linear-gradient(#f1cf55, #d7a929);
      clip-path: polygon(8% 70%, 24% 28%, 40% 70%, 52% 16%, 66% 70%, 84% 30%, 94% 70%, 94% 82%, 8% 82%);
    }
    .feature.mask {
      left: 50%;
      top: 30px;
      width: 190px;
      background: #d4ceb2;
      clip-path: polygon(54% 30%, 100% 40%, 55% 54%);
    }
    .feature.lamp::before {
      content: "";
      position: absolute;
      right: -18px;
      top: 66px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #ffc44d;
      box-shadow: 0 0 30px #ffc44d;
    }
    .feature.veil {
      left: 50%;
      top: -4px;
      border: 10px solid rgba(238, 228, 248, .7);
      border-bottom: 0;
      border-radius: 70px 70px 0 0;
    }
    .feature.helmet {
      left: 50%;
      top: 0;
      background: #8a8e89;
      clip-path: polygon(18% 58%, 26% 22%, 50% 8%, 74% 22%, 82% 58%);
    }
    .feature.goblet::before {
      content: "";
      position: absolute;
      right: -14px;
      top: 68px;
      width: 34px;
      height: 52px;
      background: #f0bf42;
      clip-path: polygon(0 0, 100% 0, 78% 52%, 56% 52%, 56% 100%, 34% 100%, 34% 52%, 12% 52%);
    }
    .feature.flower::before {
      content: "";
      position: absolute;
      right: 2px;
      top: 66px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: radial-gradient(circle, #e4d46b 0 22%, #f3f2ec 24% 58%, transparent 60%);
    }
    .feature.gear::before {
      content: "";
      position: absolute;
      right: -4px;
      top: 60px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: 9px dotted #7fd5e8;
      background: #1b2428;
    }
    .feature.keys::before {
      content: "";
      position: absolute;
      right: -18px;
      top: 76px;
      width: 64px;
      height: 28px;
      border: 5px solid #c7b675;
      border-left-width: 15px;
      border-radius: 20px;
    }
    .feature.scythe {
      position: absolute;
      left: 96px;
      top: 8px;
      width: 180px;
      height: 124px;
      border-top: 5px solid rgba(228, 236, 235, .86);
      border-right: 5px solid rgba(228, 236, 235, .86);
      border-radius: 0 90px 0 0;
      transform: rotate(24deg);
    }
    .person.orphan {
      width: 230px;
      --char-nudge: 0;
    }
    .person.orphan::before {
      left: 36px;
      width: 62px;
      height: 62px;
    }
    .person.orphan::after {
      left: 10px;
      top: 70px;
      width: 104px;
      height: 124px;
    }
    .person.orphan .feature::after {
      content: "";
      position: absolute;
      left: 140px;
      top: 42px;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: #b69b7b;
      box-shadow: 0 64px 0 28px #3a2d29;
    }
    .person.noble::before {
      background: #c39c78;
      box-shadow: inset 0 -12px 0 rgba(88, 45, 28, .22), 0 -8px 0 #3b1d20;
    }
    .person.noble::after {
      background:
        linear-gradient(90deg, transparent 0 43%, rgba(245,210,88,.95) 44% 56%, transparent 57%),
        radial-gradient(circle at 50% 28%, rgba(255,230,150,.55), transparent 22%),
        #6b2029;
    }
    .person.noble .eyes::after {
      content: "";
      position: absolute;
      left: 18px;
      top: 20px;
      width: 22px;
      height: 4px;
      border-radius: 999px;
      background: #5b2020;
    }
    .person.doctor::before {
      background: #b9b19a;
      box-shadow: inset 0 -12px 0 rgba(45, 54, 48, .28);
    }
    .person.doctor::after {
      background:

    function ensureAudio() {
      if (!audio.ctx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return null;
        audio.ctx = new AudioContext();
        audio.master = audio.ctx.createGain();
        audio.master.gain.value = 0.58;
        audio.master.connect(audio.ctx.destination);
        audio.music = audio.ctx.createGain();
        audio.music.gain.value = 0.16;
        audio.music.connect(audio.master);
        audio.sfx = audio.ctx.createGain();
        audio.sfx.gain.value = 0.42;
        audio.sfx.connect(audio.master);
      }
      if (audio.ctx.state === "suspended") audio.ctx.resume();
      audio.started = true;
      return audio.ctx;
    }

    function playTone(freq, duration, type = "sine", volume = .16, delay = 0, destination = audio.sfx) {
      const ctx = ensureAudio();
      if (!ctx || !destination) return;
      const now = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, volume), now + .012);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      osc.connect(gain);
      gain.connect(destination);
      osc.start(now);
      osc.stop(now + duration + .04);
    }

    function playNoise(duration, volume = .12, filterFreq = 900, filterType = "bandpass", delay = 0) {
      const ctx = ensureAudio();
      if (!ctx) return;
      const length = Math.max(1, Math.floor(ctx.sampleRate * duration));
      const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / length);
      const source = ctx.createBufferSource();
      const filter = ctx.createBiquadFilter();
      const gain = ctx.createGain();
      const now = ctx.currentTime + delay;
      filter.type = filterType;
      filter.frequency.setValueAtTime(filterFreq, now);
      filter.Q.value = 2.4;
      gain.gain.setValueAtTime(volume, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      source.buffer = buffer;
      source.connect(filter);
      filter.connect(gain);
      gain.connect(audio.sfx);
      source.start(now);
      source.stop(now + duration + .02);
    }

    function startBgm() {
      const ctx = ensureAudio();
      if (!ctx || audio.musicTimer) return;
      const beat = 60 / 86;
      const chords = [
        [110.00, 130.81, 164.81, 196.00],
        [87.31, 130.81, 174.61, 220.00],
        [98.00, 123.47, 146.83, 196.00],
        [82.41, 123.47, 164.81, 220.00]
      ];
      const melody = [
        329.63, 392.00, 440.00, 523.25,
        493.88, 392.00, 329.63, 293.66,
        329.63, 440.00, 392.00, 329.63,
        261.63, 293.66, 329.63, 392.00
      ];
      let loop = 0;
      const schedule = () => {
        const baseDelay = loop ? beat * 2 : 0;
        chords.forEach((chord, bar) => {
          const t = baseDelay + bar * beat * 4;
          playTone(chord[0], beat * 3.8, "sine", .16, t, audio.music);
          playTone(chord[1], beat * 3.6, "triangle", .045, t + .04, audio.music);
          playTone(chord[2], beat * 3.6, "triangle", .04, t + .08, audio.music);
          playTone(chord[3], beat * 2.7, "sine", .035, t + beat * 1.2, audio.music);
          for (let i = 0; i < 8; i++) {
            const note = chord[(i + bar) % chord.length] * 2;
            playTone(note, beat * .22, "triangle", .028, t + i * beat * .5, audio.music);
          }
        });
        melody.forEach((note, i) => {
          const t = baseDelay + i * beat;
          const strong = i % 4 === 0;
          playTone(note, beat * (strong ? .82 : .48), "sine", strong ? .085 : .06, t + .02, audio.music);
          if (strong) playTone(note * 2, beat * .28, "triangle", .025, t + .04, audio.music);
        });
        [0, 4, 8, 12].forEach(i => playTone(55, beat * .24, "sawtooth", .045, baseDelay + i * beat, audio.music));
        loop += 1;
      };
      schedule();
      audio.musicTimer = setInterval(schedule, beat * 16 * 1000);
    }

    function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight, maxLines = 999) {
      const paragraphs = String(text || "").split("\n");
      let lineCount = 0;
      for (const paragraph of paragraphs) {
        let line = "";
        for (const char of paragraph) {
          const test = line + char;
          if (ctx.measureText(test).width > maxWidth && line) {
            if (lineCount >= maxLines) return y;
            ctx.fillText(line, x, y);
            y += lineHeight;
            lineCount += 1;
            line = char;
          } else {
            line = test;
          }
        }
        if (line) {
          if (lineCount >= maxLines) return y;
          ctx.fillText(line, x, y);
          y += lineHeight;
          lineCount += 1;
        }
        y += lineHeight * .35;
      }
      return y;
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function resultAxisHtml() {
      const labels = {
        QI: ["数量权重", "个体不可替代", "人数最大化"],
        SP: ["立场偏置", "公共中立", "圈层偏袒"],
        FN: ["时效策略", "当下止损", "长期结果"],
        RB: ["规则黏性", "规则突破", "程序优先"]
      };
      return axes.map(axis => {
        const score = stats[axis.key];
        const [name, low, high] = labels[axis.key];
        const lean = score >= 50 ? high : low;
        return `<div class="result-axis"><b>${axis.key} ${score}</b><span>${name}</span><span>${lean}</span></div>`;
      }).join("");
    }

    function showPersonalityResult() {
      const type = personalityType();
      const visual = personalityVisual(type.type_code);
      resolving = false;
      gameEl.classList.add("ended", "result-mode");
      els.outcome.classList.remove("show");
      if (els.resultScreen) els.resultScreen.classList.add("show");
      if (els.resultTarot) {
        els.resultTarot.style.setProperty("--result-a", visual.a);
        els.resultTarot.style.setProperty("--result-b", visual.b);
        els.resultTarot.style.setProperty("--result-glow", visual.glow);
        els.resultTarot.style.setProperty("--skin-a", visual.skinA);
        els.resultTarot.style.setProperty("--skin-b", visual.skinB);
        els.resultTarot.style.setProperty("--hair", visual.hair);
      }
      if (els.resultArcanaTop) els.resultArcanaTop.textContent = visual.cardTitle;
      if (els.resultArcanaBottom) els.resultArcanaBottom.textContent = visual.cardFoot;
      if (els.resultSymbol) els.resultSymbol.textContent = visual.symbol;
      if (els.resultCodeBig) els.resultCodeBig.textContent = type.type_code;
      if (els.resultName) els.resultName.textContent = `${type.type_name_cn}  ${type.type_name_en}`;
      if (els.resultSlogan) els.resultSlogan.textContent = `「${type.slogan}」`;
      if (els.resultSubline) els.resultSubline.textContent = `${type.subline} / ${type.match_tag}`;
      if (els.resultBody) els.resultBody.textContent = `${type.quickread_body}\n\n隐藏名：${type.hidden_name_cn} / ${type.hidden_name_en}`;
      if (els.resultBars) els.resultBars.innerHTML = resultAxisHtml();
      if (els.resultShare) els.resultShare.textContent = type.share_text;
      if (els.hudShift) els.hudShift.textContent = "审核完成";
      if (els.hudCode) els.hudCode.textContent = type.type_code;
      playEndingSound();
    }

    function playFinaleThenResult() {
      resolving = true;
      stopBgm();
      if (els.finaleScreen) els.finaleScreen.classList.add("show");
      if (els.finaleMentor) els.finaleMentor.classList.remove("leaving");
      if (els.finaleText) els.finaleText.classList.remove("show");
      setTimeout(() => {
        if (els.finaleMentor) els.finaleMentor.classList.add("leaving");
        playTone(392, .16, "triangle", .08);
      }, 450);
      setTimeout(() => {
        if (els.finaleText) els.finaleText.classList.add("show");
        playTone(220, .5, "sine", .09);
      }, 900);
      setTimeout(() => {
        if (els.finaleScreen) els.finaleScreen.classList.add("glitch");
        playNoise(.55, .24, 1500, "bandpass");
      }, 3600);
      setTimeout(() => {
        if (els.finaleScreen) els.finaleScreen.classList.remove("show", "glitch");
        showPersonalityResult();
      }, 4550);
    }

    function restart() {
      if (audio.started) {
        stopBgm();
        startBgm();
        playButtonSound();
      }
      stats = { QI: 50, SP: 50, FN: 50, RB: 50 };
      deck = [...tutorialDeck, ...baseDeck];
      index = 0;
      night = 1;
      visitedIds = new Set();
      resolving = false;
      gameEl.classList.remove("ended", "no-stats", "result-mode");
      if (els.resultScreen) els.resultScreen.classList.remove("show");
      if (els.finaleScreen) els.finaleScreen.classList.remove("show", "glitch");
      if (els.finaleMentor) els.finaleMentor.classList.remove("leaving");
      if (els.finaleText) els.finaleText.classList.remove("show");
      els.outcome.textContent = "";
      renderStats();
      showCard();
    }

    function renderStats() {
      els.stats.innerHTML = axes.map(axis =>
        `<div class="stat" aria-label="${axis.key} ${stats[axis.key]}"><div class="stat-icon">${axisSvg(axis.key, stats[axis.key])}</div></div>`
      ).join("");
    }

    function axisSvg(key, score) {
      const id = `axisClip${key}`;
      const gradientId = `axisWarm${key}`;
      const y = 48 - score * 0.48;
      const shapes = {
        QI: '<circle class="fill-shape" cx="14" cy="14" r="4"/><circle class="fill-shape" cx="24" cy="11" r="4"/><circle class="fill-shape" cx="34" cy="14" r="4"/><circle class="fill-shape" cx="18" cy="25" r="4"/><circle class="fill-shape" cx="30" cy="24" r="4"/><circle class="fill-shape" cx="34" cy="34" r="4"/><circle class="fill-shape" cx="21" cy="37" r="4"/>',
        SP: '<circle cx="24" cy="24" r="18"/><circle cx="24" cy="24" r="10"/><circle class="fill-shape" cx="24" cy="24" r="3"/>',
        FN: '<path d="M15 7h18M15 41h18M17 9c0 9 6 10 7 15-1 5-7 6-7 15M31 9c0 9-6 10-7 15 1 5 7 6 7 15"/><path class="fill-shape" d="M18 10h12l-6 10zM24 28l8 10H16z"/>',
        RB: '<rect x="11" y="9" width="26" height="26" rx="3"/><rect x="18" y="17" width="12" height="9"/><path d="M16 39h16"/>'
      }[key];
      return `<svg class="axis-icon" viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <linearGradient id="${gradientId}" x1="0" y1="48" x2="0" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#ef7d72"/>
            <stop offset="1" stop-color="#efd266"/>
          </linearGradient>
          <clipPath id="${id}"><rect x="0" y="${y}" width="48" height="${score * 0.48}"/></clipPath>
        </defs>
        <g class="axis-base">${shapes}</g>
        <g class="axis-fill" clip-path="url(#${id})" style="--axis-fill:url(#${gradientId})">${shapes}</g>
      </svg>`;
    }

    function showCard() {
      current = deck[index];
      resolving = false;
      gameEl.classList.remove("no-stats", "result-mode");
      els.outcome.classList.remove("show");
      els.night.textContent = current.title.match(/^\d/) ? current.title : `第 ${night} 夜`;
      els.omen.textContent = resultCode();
      if (els.hudShift) els.hudShift.textContent = current.title.match(/^\d/) ? `\u6863\u6848 ${current.title}` : `\u7b2c ${night} \u6863`;
      if (els.hudCode) els.hudCode.textContent = resultCode();
      els.title.textContent = current.body;
      els.title.classList.toggle("long-text", current.body.length > 52);
      els.title.classList.toggle("dense-text", current.body.length > 76);
      els.body.textContent = current.body;
      els.roleName.textContent = current.look.name || roleName(current.look.person);
      els.left.textContent = current.left.target;
      els.right.textContent = current.right.target;
      applyLook(current.look);
      cardEl.classList.remove("peek-left", "peek-right");
      cardEl.style.opacity = "1";
      cardEl.style.transform = "translate(-50%, -50%)";
      if (audio.started) playCardIn();
    }

    function roleName(person) {
      return {
        noble: "贵族",
        doctor: "疫医",
        miner: "矿工",
        queen: "王后",
        soldier: "士兵",
        orphan: "孤儿",
        saint: "圣徒",
        warden: "狱监",
        mentor: "带教 6202666",
        reaper: "死神"
      }[person] || "亡魂";
    }

    function applyLook(look) {
      els.worldBg.style.setProperty("--world-sky", look.sky);
      els.worldBg.style.setProperty("--world-ground", look.ground);
      els.worldBg.style.setProperty("--world-scene", scenePaint(look.scene));
      els.scene.style.setProperty("--portrait-bg", portraitPaint(look.scene));
      els.scene.className = "scene";
      if (look.art && look.art !== "portrait") {
        els.scene.classList.add(`card-${look.art}`);
      }
      els.person.style.setProperty("--robe", look.robe);
      els.person.className = `person ${look.person}`;
      els.feature.className = `feature ${look.feature}`;
    }

    function scenePaint(scene) {
      const paints = {
        field: "radial-gradient(circle at 16% 22%, #e8d17a 0 40px, transparent 41px), linear-gradient(175deg, transparent 0 58%, rgba(62,45,14,.92) 59% 66%, transparent 67%), repeating-linear-gradient(104deg, transparent 0 34px, rgba(232,184,58,.60) 35px 39px, transparent 40px 68px), radial-gradient(ellipse at 50% 96%, rgba(130,94,28,.9), transparent 48%)",
        plague: "linear-gradient(90deg, rgba(0,0,0,.42) 0 11%, transparent 11% 15%, rgba(0,0,0,.38) 15% 30%, transparent 30% 35%, rgba(0,0,0,.36) 35% 49%, transparent 49% 55%, rgba(0,0,0,.40) 55% 70%, transparent 70%), linear-gradient(0deg, transparent 0 50%, rgba(130,165,120,.18) 51% 100%), radial-gradient(circle at 30% 72%, rgba(115,190,126,.22) 0 12px, transparent 13px), radial-gradient(circle at 72% 78%, rgba(115,190,126,.18) 0 18px, transparent 19px), repeating-linear-gradient(90deg, transparent 0 90px, rgba(198,215,180,.18) 91px 96px, transparent 97px 180px)",
        mine: "radial-gradient(ellipse at 50% 18%, rgba(190,140,70,.20), transparent 38%), linear-gradient(135deg, transparent 0 34%, rgba(0,0,0,.64) 35% 55%, transparent 56%), linear-gradient(45deg, transparent 0 48%, rgba(0,0,0,.58) 49% 70%, transparent 71%), repeating-linear-gradient(90deg, transparent 0 8%, rgba(191,145,72,.45) 8.4% 9%, transparent 9.4% 18%), repeating-linear-gradient(0deg, transparent 0 54px, rgba(240,190,92,.18) 55px 58px)",
        palace: "radial-gradient(circle at 82% 20%, #c5d4fa 0 38px, transparent 39px), linear-gradient(90deg, transparent 0 7%, rgba(34,24,50,.80) 7% 13%, transparent 13% 21%, rgba(78,58,108,.80) 21% 29%, transparent 29% 39%, rgba(34,24,50,.80) 39% 47%, transparent 47% 57%, rgba(78,58,108,.80) 57% 65%, transparent 65%), repeating-linear-gradient(90deg, transparent 0 90px, rgba(160,126,170,.24) 91px 98px, transparent 99px 210px), linear-gradient(0deg, rgba(40,26,58,.92) 0 16%, transparent 17%)",
        war: "repeating-linear-gradient(90deg, transparent 0 76px, rgba(50,10,10,.78) 77px 87px, transparent 88px 140px), linear-gradient(110deg, transparent 0 52%, rgba(0,0,0,.32) 53% 57%, transparent 58%), radial-gradient(ellipse at 20% 78%, rgba(120,40,24,.55), transparent 20%), radial-gradient(ellipse at 72% 70%, rgba(0,0,0,.44), transparent 24%), repeating-linear-gradient(168deg, transparent 0 80px, rgba(210,200,172,.18) 81px 84px)",
        boat: "linear-gradient(180deg, transparent 0 52%, rgba(26,58,84,.86) 53% 100%), repeating-linear-gradient(175deg, transparent 0 52px, rgba(136,181,207,.22) 53px 56px), linear-gradient(18deg, transparent 0 37%, rgba(45,20,10,.78) 38% 47%, transparent 48%), radial-gradient(ellipse at 48% 76%, rgba(190,235,245,.18), transparent 28%), linear-gradient(90deg, transparent 0 18%, rgba(225,195,120,.45) 18.5% 19.5%, transparent 20%)",
        court: "repeating-linear-gradient(90deg, rgba(0,0,0,.28) 0 62px, transparent 63px 124px), radial-gradient(circle at 50% 24%, rgba(170,205,205,.15), transparent 24rem), linear-gradient(0deg, rgba(80,70,54,.30) 0 13%, transparent 14%)"
      };
      return paints[scene] || paints.court;
    }

    function portraitPaint(scene) {
      const paints = {
        field: "linear-gradient(180deg, #dfe85e, #cbd748)",
        plague: "linear-gradient(180deg, #b8d8a6, #7f9f86)",
        mine: "linear-gradient(180deg, #c49a51, #6a4a2e)",
        palace: "linear-gradient(180deg, #dbc2ed, #a37cbd)",
        war: "linear-gradient(180deg, #c98862, #70423b)",
        boat: "linear-gradient(180deg, #9fc8d6, #4f7889)",
        court: "linear-gradient(180deg, #c9d2cd, #8aa39d)"
      };
      return paints[scene] || paints.court;
    }

    function choose(side) {
      const choice = side === "right" ? current.right : current.left;
      visitedIds.add(current.id);
      for (const [name, delta] of Object.entries(choice.effect)) stats[name] = clamp(stats[name] + delta);
      els.outcome.textContent = choice.outcome;
      els.outcome.classList.add("show");
      renderStats();
      if (els.hudCode) els.hudCode.textContent = resultCode();
      playStats(choice.effect);
      const nextId = resolveNextId(choice);
      if (nextId === "RESULT") {
        setTimeout(playFinaleThenResult, resultReadDelay(choice.outcome));
        return;
      }
      const ending = endingText();
      if (ending) {
        playEndingSound();
        resolving = false;
        els.title.textContent = "审判终局";
        els.body.textContent = ending;
        els.roleName.textContent = resultCode();
        els.left.textContent = "这不是失败";
        els.right.textContent = "只是另一个传说";
        gameEl.classList.add("ended");
        return;
      }
      if (nextId) {
        const nextIndex = findCardIndex(nextId);
        index = nextIndex >= 0 ? nextIndex : index + 1;
      } else {
        index = (index + 1) % deck.length;
      }
      night += 1;
      setTimeout(showCard, resultReadDelay(choice.outcome));
    }

    function playIntro() {
      if (!els.boot) return;
      if (audio.introStarted) return;
      audio.introStarted = true;
      els.boot.classList.add("playing");
      playIntroAudio();
      setTimeout(() => els.boot.classList.add("glitch"), 3000);
      setTimeout(() => els.boot.classList.add("hidden"), 3600);
      setTimeout(() => {
        els.boot.style.display = "none";
      }, 4100);
    }

    function endingText() {
      if (stats.QI <= 0) return "你只听见了一个人的心跳，城邦在低语中裂开。";
      if (stats.QI >= 100) return "所有名字被合并成数字，广场再也分不清哭声来自谁。";
      if (stats.SP <= 0) return "审判厅变得绝对中立，也绝对空旷；没有人相信自己曾被看见。";
      if (stats.SP >= 100) return "每个灵魂都缩回自己的圆圈，冥河两岸互不相闻。";
      if (stats.FN <= 0) return "每一次判决都止住了当下的血，却把明天交给更深的伤口。";
      if (stats.FN >= 100) return "你为遥远结果献祭了太多现在，世界等不到那个未来。";
      if (stats.RB <= 0) return "规则被一次次突破，最后连死亡也失去了边界。";
      if (stats.RB >= 100) return "所有人服从了印章，连你的镰刀也要先排队盖章。";
      return "";
    }

    function resultCode() {
      return [
        stats.QI >= 50 ? "Q" : "I",
        stats.SP >= 50 ? "S" : "P",
        stats.FN >= 50 ? "F" : "N",
        stats.RB >= 50 ? "R" : "B"
      ].join("");
    }

    cardEl.addEventListener("pointerdown", e => {
      if (gameEl.classList.contains("ended") || resolving) return;
      ensureAudio();
      dragging = true;
      startX = e.clientX;
      startY = e.clientY;
      resetPeekSound();
      cardEl.setPointerCapture(e.pointerId);
    });
    cardEl.addEventListener("pointermove", e => {
      if (!dragging) return;
      dx = e.clientX - startX;
      const dy = (e.clientY - startY) * .16;
      const rotate = Math.max(-8, Math.min(8, dx / 18));
      cardEl.classList.toggle("peek-left", dx < -24);
      cardEl.classList.toggle("peek-right", dx > 24);
      if (dx < -42) playPeek("left");
      else if (dx > 42) playPeek("right");
      else resetPeekSound();
      cardEl.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${rotate}deg)`;
    });
    cardEl.addEventListener("pointerup", () => {
      if (!dragging) return;
      dragging = false;
      cardEl.classList.remove("peek-left", "peek-right");
      if (Math.abs(dx) > 140) {
        const side = dx > 0 ? "right" : "left";
        resolving = true;
        playSwipe(side);
        cardEl.style.opacity = "0";
        cardEl.style.transform = `translate(calc(-50% + ${dx > 0 ? 900 : -900}px), -50%) rotate(${dx > 0 ? 18 : -18}deg)`;
        setTimeout(() => choose(side), 180);
      } else {
        playCancel();
        cardEl.style.transform = "translate(-50%, -50%)";
      }
      resetPeekSound();
      dx = 0;
    });
    document.addEventListener("keydown", e => {
      if (gameEl.classList.contains("ended") || resolving) return;
      if (!audio.introStarted) {
        if (e.key === "Enter" || e.key === " ") playIntro();
        return;
      }
      if (e.key === "ArrowLeft") {
        resolving = true;
        ensureAudio();
        playSwipe("left");
        choose("left");
      }
      if (e.key === "ArrowRight") {
        resolving = true;
        ensureAudio();
        playSwipe("right");
        choose("right");
      }
    });
    window.addEventListener("resize", () => {
      if (!dragging && !gameEl.classList.contains("ended")) {
        cardEl.style.transform = "translate(-50%, -50%)";
      }
    });
    els.restart.addEventListener("click", restart);
    if (els.resultRestart) els.resultRestart.addEventListener("click", restart);
    if (els.bootStart) els.bootStart.addEventListener("click", () => {
      playButtonSound();
      playIntro();
    });
    restart();
  </script>
</body>
</html>
